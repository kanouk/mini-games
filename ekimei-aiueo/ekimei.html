<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="電車のことばを指でなぞってひらがなをおぼえるアプリ">
<title>えきめい あいうえお</title>
<link rel="icon" href="../favicon.ico">
<meta name="theme-color" content="#8fd0ff">
<!-- KanjiVG derived stroke data: Copyright Ulrich Apel, CC BY-SA 3.0.
     Based on prototype 32b31cd; production interaction, accessibility and record handling updated. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&family=Klee+One:wght@600&display=swap">
<style>
/* 本番イメージ：1画面1動作。文字は題材の文字だけ。ボタンは大きく、音声と絵で進む。色はトップページに合わせる */
:root{
  --sky:#8fd0ff; --sky2:#d8f0ff; --bg:#d8f0ff; --panel:#ffffff; --panel2:#eef5fc;
  --ink:#14213d; --sub:#4a5878; --line:#c9d6e8; --rail:#dfe7f1; --railcur:#9fd6ff;
  --go:#ffcf33; --go-ink:#3a2a00; --grass:#5fae5a; --blue:#2f7fe8;
  --bronze:#c4793a; --silver:#8e9db3; --gold:#e0a90f;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --kana:"Klee One","UD Digi Kyokasho N-R","Hiragino Sans","Yu Gothic",sans-serif;
}
:root{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:800;overflow:hidden;user-select:none;-webkit-user-select:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:hidden}
.screen[hidden]{display:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;margin:0}
button:focus-visible{outline:6px solid var(--go);outline-offset:3px}

/* 大きいボタン */
.big{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:84px;padding:14px 38px;white-space:nowrap;border:5px solid var(--ink);border-radius:999px;background:var(--go);color:var(--go-ink);font-size:34px;box-shadow:0 8px 0 var(--ink)}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.big .tri{width:0;height:0;border-left:26px solid currentColor;border-top:16px solid transparent;border-bottom:16px solid transparent}
.round{width:72px;height:72px;border-radius:50%;border:4px solid var(--ink);background:var(--panel);display:grid;place-items:center;font-size:30px;box-shadow:0 5px 0 var(--ink);flex:0 0 auto}
.round:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.round svg{width:36px;height:36px;display:block}

/* タイトル */
#title{justify-content:center;gap:26px;background:linear-gradient(150deg,#eff7fb,#f7f2e7)}
#title h1{margin:0;font-size:clamp(34px,9vw,64px);line-height:1.2;text-align:center;text-wrap:balance;color:var(--ink)}
#title .train{width:min(80vw,520px);height:auto}
#title .train{animation:rock 2.8s ease-in-out infinite}
@keyframes rock{50%{transform:translateY(-3px)}}
#gear{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:26px}

/* 上のバー（もどる・しゅっぱつ） */
.bar{width:100%;max-width:720px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:84px}
.bar .mid{flex:1;min-width:0;display:flex;justify-content:center}

/* シールちょう えらび */
#home{isolation:isolate;overflow-x:hidden;background:linear-gradient(155deg,#f7f2e7,#edf4ee 65%,#e8f2f7)}
#home>.bar{max-width:1000px;flex:none}
.tiles{width:100%;max-width:1000px;display:grid;gap:24px;grid-template-columns:repeat(3,minmax(0,1fr));margin-block:auto;padding:30px 8px 52px}
.tile{--cover:#c3e8ff;display:flex;flex-direction:column;align-items:stretch;min-width:0;background:var(--panel);border:4px solid var(--ink);border-radius:30px;box-shadow:0 9px 0 var(--ink),0 18px 26px rgba(20,33,61,.12);position:relative;transition:transform .15s;isolation:isolate}
.tile[data-id="tokaido"]{--cover:#bfe9cf}
.tile[data-id="hira"]{--cover:#ffe8a8}
.tile:hover{transform:translateY(-4px)}
.tile:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.tile-cover{display:block;position:relative;aspect-ratio:3/2;background:var(--cover);border-radius:25px 25px 0 0;overflow:hidden;border-bottom:3px solid var(--ink)}
.tile-cover img{display:block;width:100%;height:100%;object-fit:cover}
.tile[data-id="names"] .tile-cover img{object-position:72% center}
.tile[data-id="tokaido"] .tile-cover img{object-position:62% center}
.tile-info{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:20px 10px 22px;position:relative}
.tile-name{font-size:clamp(23px,3.2vw,31px);line-height:1.3;white-space:nowrap}
.tile-progress{display:flex;gap:5px;align-items:center}
.tile-progress i{width:9px;height:9px;border-radius:50%;border:1.5px solid #8391a5;background:#fff}
.tile-progress i.filled{border-color:var(--ink);background:var(--ink)}
.tile .ring{position:absolute;z-index:1;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.85);box-shadow:0 2px 0 rgba(20,33,61,.18);display:grid;place-items:center;color:#68778c}
.tile .ring svg{width:20px;height:20px;fill:currentColor}
.ring.m3{border-color:var(--bronze);background:var(--bronze)}
.ring.m4{border-color:var(--silver);background:var(--silver)}
.ring.m5,.ring.m6{border-color:var(--gold);background:var(--gold)}
.tile .ring.m3{color:#fff;background:var(--bronze)}
.tile .ring.m4{color:#fff;background:var(--silver)}
.tile .ring.m5,.tile .ring.m6{color:#fff;background:var(--gold)}

/* 言葉のマス */
.grid{width:100%;max-width:720px;flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px;align-content:start;padding:12px 4px 24px}
.grid.kana{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.cell{position:relative;min-height:96px;display:grid;place-items:center;border:4px dashed var(--line);border-radius:20px;background:transparent;font-family:var(--kana);font-weight:600;font-size:24px;color:var(--sub);opacity:1;padding:10px 6px 14px;line-height:1.2;word-break:keep-all;overflow-wrap:anywhere;text-align:center}
.grid.kana .cell{font-size:40px;min-height:88px}
.cell:active{transform:scale(.96)}
.cell .bar2{position:absolute;left:14px;right:14px;bottom:6px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.cell .bar2 i{display:block;height:100%;background:var(--grass)}
.cell.l1{border-style:solid;background:var(--panel2);color:var(--sub);opacity:1}
.cell.l2,.cell.l3,.cell.l4,.cell.l5,.cell.l6{opacity:1}
.cell.l2{border-style:solid;border-color:var(--ink);background:var(--panel);color:var(--ink);box-shadow:0 4px 0 rgba(20,33,61,.2)}
.cell.l3{border:5px solid var(--bronze);background:var(--panel);color:var(--ink);box-shadow:0 4px 0 var(--bronze)}
.cell.l4{border:5px solid var(--silver);background:var(--panel);color:var(--ink);box-shadow:0 4px 0 var(--silver)}
.cell.l5{border:5px solid var(--gold);background:var(--panel);color:var(--ink);box-shadow:0 4px 0 var(--gold),0 0 0 4px rgba(224,169,15,.25)}
.cell.l6{border:5px solid transparent;color:var(--ink);background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(120deg,#ff6b6b,#ffd23d,#5cc85c,#3d8bff,#8a6bff,#ff7ac0) border-box;box-shadow:0 4px 0 var(--gold)}
.cell.pop{animation:pop .5s ease-out}
@keyframes pop{40%{transform:scale(1.15)}}

/* なぞり画面 */
#trace{gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;justify-content:flex-start;padding:4px}
.chip{flex:none;font-family:var(--kana);font-weight:600;font-size:clamp(26px,7vw,40px);line-height:1;min-width:1.5em;padding:8px 6px 10px;border:4px solid var(--line);border-radius:16px;color:var(--sub);text-align:center;background:transparent}
.chip.done{color:#fff;border-color:var(--ink);background:var(--ink)}
.chip.cur{color:var(--go-ink);border-color:var(--ink);background:var(--go)}
.pad{flex:none;max-width:100%;margin-block:auto;position:relative;width:min(92vw,calc(100dvh - 240px),560px);aspect-ratio:1;background:var(--panel);border:5px solid var(--ink);border-radius:28px;overflow:hidden;touch-action:none;box-shadow:0 8px 0 var(--ink)}
.pad svg{display:block;width:100%;height:100%}
.pad .gl{stroke:var(--line);stroke-width:.7;stroke-dasharray:2 2}
.pad .rail{fill:none;stroke:var(--rail);stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.pad .rail.cur{stroke:var(--railcur)}
.pad .tie{fill:none;stroke:var(--sub);stroke-width:6;stroke-dasharray:1.5 5.5;opacity:.5}
.pad .dots{fill:none;stroke:var(--sub);stroke-width:1.8;stroke-dasharray:2.5 3.2;opacity:.8}
.pad .ghost{fill:none;stroke:var(--line);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.pad .done{fill:none;stroke:var(--ink);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.pad .user{fill:none;stroke:var(--blue);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.pad .start{fill:var(--go);stroke:var(--ink);stroke-width:1.8;transform-box:fill-box;transform-origin:center;animation:pulse 1.1s ease-in-out infinite}
.pad .start.loud{animation:pulse .55s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.35)}}
.pad .num{font-family:var(--font);font-weight:800;font-size:8px;fill:var(--ink)}
.pad .arrow{fill:var(--ink)}
.pad .train{pointer-events:none}
.pad.shake{animation:shake .4s}
@keyframes shake{25%{translate:-6px 0}75%{translate:6px 0}}
.flash{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--kana);font-weight:600;font-size:min(60vw,320px);color:var(--ink);background:rgba(255,207,51,.6);animation:fl .9s ease-out forwards;pointer-events:none}
@keyframes fl{from{opacity:0;scale:.7}30%{opacity:1;scale:1}to{opacity:0;scale:1.05}}

/* できた画面 */
#done{justify-content:center;gap:22px;background:linear-gradient(var(--sky) 0%,var(--sky2) 70%)}
#done .sticker{font-family:var(--kana);font-weight:600;font-size:clamp(40px,11vw,80px);background:var(--panel);border:6px solid var(--gold);border-radius:28px;padding:14px 30px;box-shadow:0 8px 0 var(--gold);animation:stamp .6s cubic-bezier(.2,1.6,.4,1)}
#done .sticker.m3{border-color:var(--bronze);box-shadow:0 8px 0 var(--bronze)}
#done .sticker.m4{border-color:var(--silver);box-shadow:0 8px 0 var(--silver)}
#done .sticker.m0{border-color:var(--ink);box-shadow:0 8px 0 var(--ink)}
@keyframes stamp{from{scale:2;opacity:0}to{scale:1;opacity:1}}
.track{position:relative;width:100%;max-width:720px;height:70px;overflow:hidden}
.track::after{content:"";position:absolute;left:0;right:0;bottom:8px;height:6px;background:repeating-linear-gradient(90deg,var(--sub) 0 10px,transparent 10px 24px)}
.track .t{position:absolute;left:-160px;bottom:14px;width:140px;height:auto;animation:cross 2.2s ease-in-out forwards}
@keyframes cross{to{left:calc(100% + 160px)}}
.stars{display:flex;gap:10px;font-size:34px}

/* おうちの人（設定） */
#settings{justify-content:flex-start;gap:14px;font-size:20px;overflow-y:auto}
#settings .opt{flex:none;flex-wrap:wrap;width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:4px solid var(--ink);border-radius:20px;padding:14px 18px}
#settings .sw{display:flex;flex-wrap:wrap;gap:8px}
#settings .sw button{min-height:72px;min-width:72px;border:3px solid var(--ink);border-radius:999px;padding:8px 16px;font-size:18px;background:var(--panel)}
#settings .sw button[aria-pressed="true"]{background:var(--go);color:var(--go-ink)}
#settings .stat{width:100%;max-width:560px;font-size:16px;color:var(--sub);line-height:1.6}
#settings .credit{font-size:12px;color:var(--sub);max-width:560px;line-height:1.5;font-weight:500}
.portal{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:max(12px,env(safe-area-inset-top,0px));text-decoration:none}
#done>.back{position:absolute;top:max(12px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px))}
#home{overflow-y:auto}
#settings .bar{flex:none}
#settings .credit a{color:inherit}
[hidden]{display:none!important}
@media(max-width:600px){.tiles{grid-template-columns:1fr;max-width:480px;gap:16px;padding:18px 4px 32px}.tile{flex-direction:row;min-height:148px;border-radius:25px}.tile-cover{flex:0 0 48%;align-self:stretch;aspect-ratio:auto;border-radius:20px 0 0 20px;border-bottom:0;border-right:3px solid var(--ink)}.tile-info{flex:1;min-width:0;gap:14px;padding:22px 8px 16px}.tile-name{font-size:clamp(19px,5.5vw,24px)}.tile-progress{gap:3px}.tile-progress i{width:8px;height:8px}.tile .ring{width:25px;height:25px;top:8px;right:8px;border-width:2px}.tile .ring svg{width:15px;height:15px}}
@media(max-width:500px){.bar{gap:8px}.bar>span{display:none}.grid{gap:10px}#goBtn{font-size:23px!important;padding:10px 18px!important}.chip{min-width:1.3em;font-size:28px}.pad{border-radius:22px}#settings .opt{padding:12px;font-size:18px}}
@media(max-height:700px) and (max-width:600px){.tiles{gap:12px;padding-block:8px 24px}.tile{min-height:120px}.tile-name{font-size:20px}.tile-info{gap:10px}}
@media(max-height:600px){#title{gap:14px}#title .train{width:170px}#title h1{font-size:34px}#done{gap:12px}#done .sticker{font-size:40px}}
@media(max-height:600px) and (min-width:601px){.tiles{max-width:850px;padding-block:10px 22px;gap:18px}.tile-cover{aspect-ratio:300/155}.tile-info{padding:12px 6px 14px;gap:10px}.tile-name{font-size:24px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<!-- タイトル -->
</head>

function normalizeState(raw){
  const state={...DEFAULTS,counts:{},days:[],completed:0};
  if(!raw||typeof raw!=='object')return state;
  for(const k of Object.keys(OPTIONS))if(OPTIONS[k].includes(raw[k]))state[k]=raw[k];
  for(const s of SHEETS)for(const w of s.words){const k=key(s.id,w),v=raw.counts?.[k];if(Number.isSafeInteger(v)&&v>0)state.counts[k]=Math.min(v,1000000);}
  if(Array.isArray(raw.days))state.days=[...new Set(raw.days.filter(d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!Number.isNaN(Date.parse(d))))].sort();
  // 試作の保存記録も引き継ぐ。派生した「あいうえお」の加算を合計に二重計上しない。
  if(Number.isSafeInteger(raw.completed)&&raw.completed>=0)state.completed=raw.completed;
  else{
    const derived={};
    for(const s of SHEETS.filter(s=>!s.kana))for(const w of s.words){const c=count(state,s.id,w);state.completed+=c;for(const ch of new Set([...w].map(ch=>BASE[ch]||ch)))derived[ch]=(derived[ch]||0)+c;}
    for(const ch of HIRA)state.completed+=Math.max(0,count(state,'hira',ch)-(derived[ch]||0));
  }
  return state;
}
function recordCompletion(state,sid,w,day){
  if(!SHEETS.some(s=>s.id===sid&&s.words.includes(w)))throw new Error('Unknown word');
  const result={...state,counts:{...state.counts},days:[...state.days],completed:state.completed+1};
  const bump=(id,ch)=>{const k=key(id,ch);result.counts[k]=(result.counts[k]||0)+1;};
  bump(sid,w);
  if(sid!=='hira')for(const ch of new Set([...w].map(ch=>BASE[ch]||ch)))if(HIRA.has(ch))bump('hira',ch);
  if(!result.days.includes(day))result.days.push(day);
  return result;
}

}

// KanjiVGのこの83文字は M と相対三次ベジェ c のみ。曲線を細分し、弧長で24等分する。
function strokeSamples(d,divisions=24){
  if(typeof d!=='string'||!/^[\s\d.,+\-Mc]+$/.test(d))throw new Error('Unsupported stroke path');
  const t=d.match(/[Mc]|[-+]?(?:\d*\.\d+|\d+\.?\d*)/g)||[];
  let at=0,x=0,y=0;const dense=[];
  const number=()=>{const v=Number(t[at++]);if(!Number.isFinite(v))throw new Error('Invalid stroke path');return v;};
  if(t[at++]!=='M')throw new Error('Missing stroke start');
  x=number();y=number();dense.push({x,y});
  while(at<t.length){
    if(t[at]==='c')at++;
    const x0=x,y0=y,x1=x+number(),y1=y+number(),x2=x+number(),y2=y+number(),x3=x+number(),y3=y+number();
    for(let j=1;j<=48;j++){const u=j/48,v=1-u;dense.push({x:v*v*v*x0+3*v*v*u*x1+3*v*u*u*x2+u*u*u*x3,y:v*v*v*y0+3*v*v*u*y1+3*v*u*u*y2+u*u*u*y3});}
    x=x3;y=y3;
  }
  const lengths=[0];for(let j=1;j<dense.length;j++)lengths.push(lengths[j-1]+dist(dense[j-1],dense[j]));
  const length=lengths[lengths.length-1];if(!(length>0))throw new Error('Empty stroke');
  const result=[];let j=1;
  for(let k=0;k<=divisions;k++){const target=length*k/divisions;while(j<lengths.length-1&&lengths[j]<target)j++;const a=dense[j-1],b=dense[j],span=lengths[j]-lengths[j-1],f=span?(target-lengths[j-1])/span:0;result.push({x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f});}
  return result;
}
function judge(user,path,tolerance='normal'){
  if(!Array.isArray(user)||user.length<3||user.some(p=>!p||!Number.isFinite(p.x)||!Number.isFinite(p.y)))return{ok:false,why:'short'};
  const wide=tolerance==='wide',TOL=wide?18:12,ST=wide?24:16,COV=wide?.55:.7,EN=wide?34:24;
  const g=typeof path==='string'?strokeSamples(path):path;
  if(!Array.isArray(g)||g.length<2)return{ok:false,why:'short'};
  if(dist(user[0],g[0])>ST)return{ok:false,why:'start'};
  let hit=0,last=-1,back=0;
  for(const q of g){let best=Infinity,bi=-1;for(let i=0;i<user.length;i++){const dd=dist(user[i],q);if(dd<best){best=dd;bi=i;}}if(best<=TOL){hit++;if(bi<last-3)back++;last=Math.max(last,bi);}}
  if(hit/g.length<COV)return{ok:false,why:'cover'};
  if(back>=g.length*.3)return{ok:false,why:'dir'};
  if(dist(user[user.length-1],g[g.length-1])>EN)return{ok:false,why:'end'};
  return{ok:true};
}

const SHEET_COVERS=Object.fromEntries(['names','tokaido','hira'].map(id=>[id,'<img src="'+ART[id]+'" alt="" width="960" height="640" decoding="async">']));
function renderHome(){
  $('tiles').innerHTML=SHEETS.map(s=>{const lv=sheetLevel(S,s),done=s.words.filter(w=>count(S,s.id,w)>0).length,dots=Math.round(done/s.words.length*10);
    return `<button class="tile" type="button" data-id="${s.id}" aria-label="${s.name}"><span class="ring m${lv}" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 2 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z"/></svg></span><span class="tile-cover" aria-hidden="true">${SHEET_COVERS[s.id]}</span><span class="tile-info"><span class="tile-name">${s.name}</span><span class="tile-progress" aria-hidden="true">${Array.from({length:10},(_,i)=>'<i'+(i<dots?' class="filled"':'')+'></i>').join('')}</span></span></button>`;}).join('');
}
$('tiles').addEventListener('click',e=>{const b=e.target.closest('.tile');if(!b)return;ensureAudio();tap();curSheet=SHEETS.find(s=>s.id===b.dataset.id);show('sheet');renderSheet();say(curSheet.name);});
function renderSheet(){
  const g=$('grid');g.className='grid'+(curSheet.kana?' kana':'');
  g.innerHTML=curSheet.words.map(w=>{const c=count(S,curSheet.id,w),lv=level(c),nt=nextTh(c),pct=nt?Math.round((c-TH[lv])/(nt-TH[lv])*100):100;
    return `<button class="cell l${lv}" type="button" data-w="${w}" aria-label="${w}">${w}<span class="bar2" aria-hidden="true"><i style="width:${pct}%"></i></span></button>`;}).join('');
}
$('grid').addEventListener('click',e=>{const b=e.target.closest('.cell');if(!b)return;ensureAudio();tap();queue=[];startTrace(b.dataset.w);});
$('goBtn').addEventListener('click',()=>{ensureAudio();tap();queue=selectWords(curSheet,S);startTrace(queue.shift());});

function aid(){return aidLevel(count(S,curSheet.id,word),S.aid);}
function startTrace(w){word=w;ci=0;si=0;miss=0;phase='ready';show('trace');renderChips();renderPad();say(word);if(word.length>1)say(nameOf(word[0]),false);scheduleDemo();}
function scheduleDemo(){cancelDemo();if(S.autodemo==='on'&&aid()===0)demoTimer=later(()=>{demoTimer=null;demo();},900);}
function renderChips(){
  $('chips').innerHTML=[...word].map((c,i)=>`<span class="chip${i<ci||phase==='complete'&&i===ci?' done':i===ci?' cur':''}"${i===ci?' aria-current="step"':''}>${c}</span>`).join('');
  $('chips').querySelector('[aria-current]')?.scrollIntoView({block:'nearest',inline:'center',behavior:'instant'});
}
function renderPad(){
  cancelDemo();svg.replaceChildren();const strokes=STROKES[word[ci]],a=aid();startEl=null;
  svg.setAttribute('aria-label',nameOf(word[ci])+'を なぞる');
  svg.append(el('line',{x1:54.5,y1:0,x2:54.5,y2:109,class:'gl'}),el('line',{x1:0,y1:54.5,x2:109,y2:54.5,class:'gl'}));
  const g=el('g');svg.append(g);
  strokes.forEach((d,i)=>{
    if(i<si){g.append(el('path',{d,class:'done'}));return;}
    if(a===0)g.append(el('path',{d,class:'rail'+(i===si?' cur':'')}),el('path',{d,class:'tie'}));
    else if(a===1)g.append(el('path',{d,class:'dots'}));
    else if(a===2)g.append(el('path',{d,class:'ghost'}));
    if(i===si&&(a<=1||a===3&&si===0)){
      const points=strokeSamples(d),p0=points[0],p1=points[2];
      startEl=el('circle',{cx:p0.x,cy:p0.y,r:a===3?2.5:5,class:'start'});g.append(startEl);
      if(a<=1){const angle=Math.atan2(p1.y-p0.y,p1.x-p0.x)*180/Math.PI;g.append(el('path',{d:'M0 -3.5 L7 0 L0 3.5 Z',class:'arrow',transform:`translate(${p1.x} ${p1.y}) rotate(${angle})`}));if(strokes.length>1){const num=el('text',{x:Math.max(5,p0.x-8),y:Math.max(8,p0.y-7),class:'num'});num.textContent=i+1;g.append(num);}}
    }
  });
  userPath=el('path',{d:'',class:'user'});trainEl=el('image',{href:ART.train,x:-30,y:-30,width:18,height:9,class:'train','aria-hidden':'true'});g.append(userPath,trainEl);
  $('demoBtn').disabled=phase!=='ready';
}
function toSvg(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*109,y:(e.clientY-r.top)/r.height*109};}
function addPoint(e){const p=toSvg(e);if(pts.length&&dist(p,pts[pts.length-1])<.25)return;pts.push(p);if(pts.length>2048)pts=pts.filter((_,i)=>i%2===0||i===pts.length-1);userPath.setAttribute('d',pts.map((q,i)=>(i?'L':'M')+q.x.toFixed(2)+' '+q.y.toFixed(2)).join(' '));trainEl.setAttribute('x',p.x-9);trainEl.setAttribute('y',p.y-5);}
function clearTrail(){userPath?.setAttribute('d','');trainEl?.setAttribute('x',-30);}
function onDown(e){
  if(page!=='trace'||phase!=='ready'||!e.isPrimary||e.button!==0||activePointer!==null)return;
  e.preventDefault();ensureAudio();cancelDemo();startEl?.classList.remove('loud');activePointer=e.pointerId;pts=[];try{pad.setPointerCapture(e.pointerId);}catch(_){}addPoint(e);
}
function onMove(e){if(!e.isPrimary||activePointer!==e.pointerId)return;e.preventDefault();const batch=e.getCoalescedEvents?.();for(const sample of batch?.length?batch:[e])addPoint(sample);}
function onUp(e){
  if(!e.isPrimary||activePointer!==e.pointerId)return;addPoint(e);const result=judge(pts,STROKES[word[ci]][si],S.tol);releasePointer();
  if(result.ok){katan();si++;miss=0;if(si===STROKES[word[ci]].length)charDone();else renderPad();}
  else{miss++;poyon();pad.classList.remove('shake');void pad.offsetWidth;pad.classList.add('shake');clearTrail();startEl?.classList.add('loud');if(result.why==='start'&&miss===1)say('ここから');if(miss>=2){miss=0;demoTimer=later(()=>{demoTimer=null;demo();},400);}}
}
function onCancel(e){if(activePointer!==e.pointerId)return;releasePointer();clearTrail();}
pad.addEventListener('pointerdown',onDown);pad.addEventListener('pointermove',onMove);pad.addEventListener('pointerup',onUp);pad.addEventListener('pointercancel',onCancel);pad.addEventListener('lostpointercapture',onCancel);pad.addEventListener('contextmenu',e=>e.preventDefault());
function charDone(){
  phase='complete';renderPad();renderChips();chime();say(nameOf(word[ci]));
  const flash=document.createElement('div');flash.className='flash';flash.textContent=word[ci];pad.append(flash);
  later(()=>{flash.remove();if(ci+1===word.length){wordDone();return;}ci++;si=0;miss=0;phase='ready';renderChips();renderPad();say(nameOf(word[ci]));scheduleDemo();},950);
}
function demo(){
  if(page!=='trace'||phase!=='ready'||activePointer!==null)return;
  cancelDemo();const path=el('path',{d:STROKES[word[ci]][si]}),length=path.getTotalLength(),duration=Math.max(700,Math.min(1600,length*14)),token=epoch,g=svg.querySelector('g');
  const trail=el('path',{d:'',class:'user',opacity:.6}),train=el('image',{href:ART.train,width:18,height:9,class:'train','aria-hidden':'true'});g.append(trail,train);demoElements=[trail,train];
  const draw=f=>{const q=path.getPointAtLength(length*f);train.setAttribute('x',q.x-9);train.setAttribute('y',q.y-5);const points=[];for(let i=0;i<=24;i++){const p=path.getPointAtLength(length*f*i/24);points.push((i?'L':'M')+p.x.toFixed(2)+' '+p.y.toFixed(2));}trail.setAttribute('d',points.join(' '));};
  if(reduced.matches){draw(1);demoTimer=later(cancelDemo,900);return;}
  const start=performance.now();
  function frame(now){if(page!=='trace'||token!==epoch||activePointer!==null)return;const f=Math.min(1,(now-start)/duration);draw(f);if(f<1)demoFrame=requestAnimationFrame(frame);else{demoFrame=0;demoTimer=later(cancelDemo,350);}}
  demoFrame=requestAnimationFrame(frame);
}
$('demoBtn').addEventListener('click',()=>{ensureAudio();tap();demo();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){releasePointer();clearTrail();cancelDemo();stopSpeech();}});

function wordDone(){
  if(phase!=='complete')return;
  phase='done';S=recordCompletion(S,curSheet.id,word,localDay());save();const lv=level(count(S,curSheet.id,word));show('done');
  const sticker=$('sticker');sticker.textContent=word;sticker.className='sticker m'+(lv>=3?lv:0);
  $('stars').innerHTML=[0,1,2].map(i=>`<span style="opacity:${i<Math.min(3,Math.ceil(lv/2))?1:.25}">⭐</span>`).join('');
  $('track').innerHTML='<img class="t" src="'+ART.train+'" alt="">';fanfare();
  $('nextBtn').setAttribute('aria-label',queue.length?'つぎの ことば':'ことばを えらぶ');
  later(()=>say(curSheet.id==='tokaido'?`つぎは、${word}。${word}。`:word),400);
}
$('nextBtn').addEventListener('click',()=>{ensureAudio();tap();if(queue.length)startTrace(queue.shift());else{show('sheet');renderSheet();}});
function renderSettings(){
  document.querySelectorAll('#settings .sw[data-k]').forEach(sw=>{const k=sw.dataset.k;sw.setAttribute('aria-label',sw.previousElementSibling.textContent);sw.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(S[k]===b.dataset.v)));});
  let title=TITLES[0][1];for(const [minimum,name]of TITLES)if(S.completed>=minimum)title=name;
  const top=Object.entries(S.counts).filter(([k])=>k.startsWith('hira:')).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>k.slice(5)+' '+v+'回').join('、');
  $('stat').replaceChildren();for(const line of [`なぞり終えた ことば：${S.completed}回（${title}）`,`あそんだ日：${S.days.length}日`,`よく なぞった字：${top||'まだ'}`]){const p=document.createElement('p');p.textContent=line;$('stat').append(p);}
}
document.querySelectorAll('#settings .sw[data-k]').forEach(sw=>sw.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ensureAudio();tap();S[sw.dataset.k]=b.dataset.v;if(S.voice==='off')stopSpeech();save();renderSettings();}));
$('wipe').addEventListener('click',()=>{if(!window.confirm('なぞった回数と あそんだ日を ぜんぶ消しますか？'))return;S={...S,counts:{},days:[],completed:0};save();renderSettings();});
show('title');

})();
</script>
