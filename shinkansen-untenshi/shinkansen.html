<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>しんかんせん うんてんし</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* 1画面ゲーム：上＝景色（キャンバス）＋車内表示器、下＝大きな操作ボタン。世界観に合わせた単一テーマ */
:root{
  --sky:#8fd0ff;
  --night:#14213d;
  --panel:#ffffff;
  --ink:#14213d;
  --go:#ffcf33;
  --go-ink:#3a2a00;
  --horn:#ff8a3d;
  --chip:#24365e;
  --chip-on:#3d8bff;
  --rail:#c3ccd9;
  --led-bg:#121212;
  --led:#ffb21e;
  --led-dim:#5a3c06;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --dot:"DotGothic16","MS Gothic","Osaka-Mono",monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--panel);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.app{position:relative;height:100%;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0;background:var(--sky);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}

.hud{position:absolute;top:10px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;gap:12px;align-items:flex-start;pointer-events:none}
.fs-ipad .hudMain>.row:first-child{padding-left:65px}
.hudMain{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.pill{background:var(--panel);color:var(--ink);border-radius:18px;padding:6px 14px;box-shadow:0 2px 0 rgba(20,33,61,.18)}
.speed{display:flex;align-items:baseline;gap:6px}
.speed b{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right;line-height:1.1}
.speed small{font-size:14px;font-weight:500}
.speed .max{font-size:12px;color:#4b5873;margin-left:4px}
.lineinfo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;min-width:0}
.lineinfo i{width:14px;height:14px;border-radius:50%;background:var(--lc,#3d8bff);flex:none}
.lineinfo small{font-weight:500;font-size:14px}
.led{background:var(--led-bg);border:3px solid #3a3a3a;border-radius:10px;height:46px;overflow:hidden;position:relative;
  font-family:var(--dot);color:var(--led);font-size:26px;line-height:40px;white-space:nowrap;
  background-image:radial-gradient(var(--led-dim) 0.8px,transparent 1px);background-size:4px 4px}
.led span{display:inline-block;padding-left:100%;animation:ledscroll var(--dur,12s) linear infinite;text-shadow:0 0 6px rgba(255,178,30,.55)}
@keyframes ledscroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.route{position:absolute;bottom:6px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;pointer-events:none;padding-block:4px}
.route .line{position:relative;flex:1;height:8px;border-radius:4px;background:var(--rail);min-width:0;margin:0 29px}
.route .tmark{position:absolute;top:50%;width:58px;height:24px;margin:-13px 0 0 -29px;left:0;overflow:visible}
.tmark .b{fill:var(--low,#f7f9fb);stroke:#5b6676;stroke-width:.8}
.tmark .u{fill:var(--up,#f7f9fb)}.tmark .l{fill:var(--line,#d6283c)}.tmark .w{fill:#2c3a4f}
.map{align-self:flex-end;flex:none;width:min(34vw,220px,34vh);
  background:var(--panel);border-radius:16px;padding:6px;box-shadow:0 3px 0 rgba(20,33,61,.18);pointer-events:none}
.map canvas{display:block;width:100%;aspect-ratio:1;max-width:100%;border-radius:10px}
.map small{display:block;color:#4b5873;font-size:10px;text-align:center;margin-top:2px}
.banner{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:56px;pointer-events:none;
  background:rgba(20,33,61,.92);color:#fff;border-radius:16px;padding:8px 18px 10px;box-shadow:0 4px 12px rgba(0,0,0,.25);
  display:flex;flex-direction:column;gap:1px;border-left:6px solid var(--lc,#ffcf33)}
.banner small{font-size:13px;font-weight:800;letter-spacing:.12em;color:#c9d3e6}
.banner b{font-size:clamp(28px,6vw,40px);font-weight:800;line-height:1.1;color:#ffe08a;font-variant-numeric:tabular-nums}
.banner span{white-space:nowrap;font-size:clamp(14px,3.6vw,17px);font-weight:800}

.bar{display:flex;flex-wrap:wrap;gap:12px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:var(--font);border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.go,.horn,canvas{touch-action:none}
button:focus-visible{outline:4px solid var(--panel);outline-offset:3px}
/* うんてんの ボタン：act（きほん）＋ main（おおきい 3つ）／ sub（ちいさい 2つ）。いろは --bg と --sh で きりかえる */
.act{min-height:92px;border-radius:24px;background:var(--bg);color:#fff;font-weight:800;box-shadow:0 6px 0 var(--sh);white-space:nowrap}
.act:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh)}
.act.main{flex:1 1 0;min-width:120px;padding:0 8px;font-size:clamp(16px,2.1vw,26px)}
.act.sub{flex:0 0 auto;min-width:92px;padding:0 14px;font-size:clamp(15px,1.8vw,19px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.act.sub svg{width:34px;height:34px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.go{--bg:var(--go);--sh:#c99a00;color:var(--go-ink)}
.go.held{transform:translateY(4px);box-shadow:0 2px 0 var(--sh)}
.go.wait{--bg:#e6e9ef;--sh:#a9b0bd;color:#5b6475}
.annbtn{--bg:#2aa59a;--sh:#1b7a71}
.crewbtn{--bg:#5b5fc7;--sh:#3e419a}
.horn{--bg:var(--horn);--sh:#c45e1d}
.ebtn{--bg:#d62839;--sh:#9c1626}
.ebtn:disabled{--bg:#4a2a35;--sh:#2e1a20;color:#a88c94;cursor:default;transform:none}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow-y:auto;z-index:5;background:rgba(20,33,61,.97);
  border-radius:22px 22px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.3);
  padding-block:14px max(14px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app:has(.sheet:not([hidden])) .banner{display:none}
.sheet h2{margin:0 0 10px;font-size:22px;font-weight:800;text-align:center}
.sheet .close{margin-top:12px;min-height:54px}
.ann.em{border-left-color:#d62839;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px}
.ann.em .eic{width:44px;height:44px;flex:none;padding:8px;border-radius:50%;background:#fde4e6;color:#d62839;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;box-sizing:border-box}
.ann.em .etx{display:flex;flex-direction:column;gap:2px;min-width:0}
.ann.em small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ann.crew{border-left-color:#5b5fc7}
.anngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;max-width:820px;margin:0 auto}
.ann{min-height:84px;border-radius:18px;background:var(--panel);color:var(--ink);font-size:20px;font-weight:800;padding:8px 14px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;border-left:10px solid #2aa59a}
.ann small{font-size:13px;font-weight:500;color:#4b5873}
.ann.playing{background:#dff5f2}
.opts{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;align-content:center}
.opt{width:66px;height:66px;padding:4px 2px;border-radius:16px;background:var(--chip);color:#fff;font-weight:800;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.opt svg{width:28px;height:28px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.opt span{font-size:11px;line-height:1.1;white-space:nowrap}
.opt[aria-pressed="true"]{background:var(--chip-on)}
.painter .box{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.preview{background:var(--sky);border-radius:16px;overflow:hidden}
.preview canvas{display:block;width:100%;height:auto;aspect-ratio:420/90;max-width:100%}
.part h3{margin:0 0 6px;font-size:18px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:var(--c);position:relative}
.sw[aria-pressed="true"]{border:4px solid var(--go);box-shadow:0 0 0 3px var(--night) inset}
.reset{min-height:60px;min-width:160px;border-radius:18px;background:var(--chip);color:#fff;font-size:20px;font-weight:800}

.trip{padding-block:0 !important}
.tripbox{max-width:980px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.triphead{display:flex;align-items:center;gap:10px;padding:16px 4px 12px}
.triphead i{width:16px;height:16px;border-radius:50%;background:var(--lc)}
.triphead h2{margin:0;font-size:24px;text-align:left}
.tripgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;flex:1}
@media (max-width:720px){.tripgrid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);color:var(--ink);border-radius:18px;padding:14px}
.card h3{margin:0 0 10px;font-size:15px;font-weight:800;color:#4b5873}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;background:#eef2f8;padding:4px;border-radius:14px}
.kinds button{min-height:46px;border-radius:11px;background:transparent;color:#4b5873;font-size:15px;font-weight:800;padding:0 6px}
.kinds button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,33,61,.18)}
.strow.pass .dot{width:10px;height:10px;margin:-5px 0 0 -5px;border-width:2px}
.strow.pass .nm b{font-size:15px;font-weight:500}
.strow .ps{margin-left:auto;font-size:11px;color:#8a94a6}
.ends{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:stretch}
.endcard{background:#eef2f8;color:var(--ink);border-radius:14px;padding:8px 10px;text-align:left;border:3px solid transparent;display:flex;flex-direction:column;gap:1px;min-width:0}
.endcard small{font-size:12px;font-weight:800;color:#4b5873}
.endcard b{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.endcard span{font-size:12px;color:#4b5873;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.endcard[aria-pressed="true"]{border-color:var(--lc);background:#fff}
.swap{width:46px;border-radius:14px;background:#eef2f8;color:var(--ink);display:grid;place-items:center}
.swap svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hint{margin:10px 2px 6px;font-size:13px;font-weight:800;color:#4b5873}
.stlist{list-style:none;margin:0;padding:0;max-height:min(52vh,560px);overflow-y:auto;border-radius:12px;background:#f6f8fb}
.strow{position:relative;width:100%;display:flex;align-items:center;gap:12px;padding:7px 12px 7px 44px;background:none;color:var(--ink);text-align:left;min-height:46px}
.strow::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:5px;margin-left:-2.5px;background:#cfd6e0}
li:first-child>.strow::before{top:50%}li:last-child>.strow::before{bottom:50%}
.strow.in::before{background:var(--lc)}
.strow .dot{position:absolute;left:22px;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:3px solid #b3bdcb;box-sizing:border-box}
.strow.in .dot{border-color:var(--lc)}
.strow.end .dot{width:22px;height:22px;margin:-11px 0 0 -11px;background:var(--lc);border-color:#fff;box-shadow:0 0 0 2px var(--lc)}
.strow .nm{display:flex;flex-direction:column;min-width:0}
.strow .nm b{font-size:18px;font-weight:800}
.strow .nm small{font-size:11px;color:#4b5873}
.strow:not(.in) .nm{opacity:.55}
.strow .tag{margin-left:auto;font-size:12px;font-weight:800;color:#fff;background:var(--lc);border-radius:999px;padding:3px 10px}
.strow:hover{background:#eaf0f8}
.timecard .trow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) auto repeat(2,minmax(0,1fr));gap:6px;align-items:center}
@media (max-width:460px){.timecard .trow{grid-template-columns:repeat(4,minmax(0,1fr))}.timecard .tbig{grid-column:1/-1;order:-1;justify-self:center}}
.tstep{min-height:54px;min-width:0;padding:0 2px;white-space:nowrap;border-radius:14px;background:#e3e9f3;color:var(--ink);font-size:15px;font-weight:800;touch-action:manipulation}
.tstep:active{transform:translateY(2px)}
.tstep:disabled{opacity:.35;cursor:default}
.tbig{text-align:center;font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;padding:0 8px;line-height:1.1}
.ttquick{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ttquick button{min-height:40px;padding:0 12px;white-space:nowrap;border-radius:999px;background:#eef2f8;color:var(--ink);font-size:14px;font-weight:800;touch-action:manipulation}
.ttrange{margin:8px 0 0;font-size:13px;color:#4b5873}
.sumcard{margin-top:16px}
.sumline{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.sumline .pt b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.sumline .pt span{font-size:15px;font-weight:800}
.sumline .pt:last-child{text-align:right}
.sumline .ar{height:6px;border-radius:3px;background:var(--lc);position:relative}
.sumline .ar::after{content:"";position:absolute;right:-2px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:12px solid var(--lc);border-right:0}
.summeta{margin:10px 0 0;font-size:14px;color:#4b5873;text-align:center}
/* ぜんがめんの パネル：したに とじる・きめる ボタンを いつも だす */
.pbar{position:sticky;bottom:0;z-index:2;display:flex;gap:10px;justify-content:flex-end;max-width:980px;margin:16px auto 0;padding:14px 0 max(14px,env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(20,33,61,0),rgba(20,33,61,.97) 30%)}
.pbar .close{margin:0;min-width:0;flex:0 1 320px;white-space:nowrap;padding:0 18px;font-size:clamp(17px,4.6vw,22px)}
.pbar .reset{flex:none;min-width:96px;padding:0 16px;font-size:clamp(17px,4.6vw,20px)}
.tripsum{text-align:center;margin:6px 0 12px;font-size:20px;font-weight:800;color:#fff}
.picker,.painter{position:absolute;inset:0;background:rgba(20,33,61,.96);overflow-y:auto;z-index:5;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.clock{display:flex;align-items:baseline;gap:6px}
.clock b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.clock small{font-size:13px;font-weight:500}
.ttwrap{max-width:560px;margin:14px auto 0;overflow-x:auto;border-radius:12px}
.ttable{width:100%;border-collapse:collapse;background:var(--panel);color:var(--ink);font-variant-numeric:tabular-nums}
.ttable th{background:#e6ebf3;font-size:15px;padding:8px 12px;text-align:left}
.ttable td{font-size:19px;font-weight:800;padding:7px 12px;border-top:1px solid #e3e8f0}
.ttable td small{display:block;font-size:11px;font-weight:500;color:#4b5873}
.ttable td small.late{color:#d62839;font-weight:800}
.ttable tr.now td{background:#fff1bf}
.ttable tr.pass td{color:#8a94a6;font-weight:500}
.ttable .t{text-align:right;width:5.5em}
.picker h2,.painter h2{margin:0 0 14px;font-size:clamp(19px,5.4vw,26px);font-weight:800;text-align:center;white-space:nowrap}
.grid{padding-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;max-width:980px;margin:0 auto}
.lineBtn{min-height:84px;border-radius:18px;background:var(--panel);color:var(--ink);text-align:left;padding:10px 14px 10px 22px;
  position:relative;display:flex;flex-direction:column;justify-content:center;gap:2px}
.lineBtn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;border-radius:18px 0 0 18px;background:var(--lc)}
.lineBtn b{font-size:22px;font-weight:800;white-space:nowrap}
.lineBtn.thru b{font-size:clamp(17px,1.9vw,20px)}
.gridhead{grid-column:1/-1;margin:10px 0 -2px;font-size:17px;font-weight:800;color:#ffe08a}
.lineBtn small{font-size:13px;font-weight:500;color:#4b5873}
.lineBtn[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--lc)}
.lineBtn[aria-pressed="true"]::after{content:"のっている";position:absolute;top:-10px;right:12px;box-shadow:0 2px 0 rgba(0,0,0,.15);font-size:12px;font-weight:800;color:#fff;background:var(--lc);border-radius:999px;padding:2px 9px}
.close{display:block;margin:18px auto 0;min-height:60px;min-width:200px;border-radius:18px;background:var(--go);color:var(--go-ink);font-size:22px;font-weight:800}
@media (prefers-reduced-motion:reduce){
  .led span{animation:none;padding-left:8px;white-space:normal;font-size:20px;line-height:1.2}
  .led{height:auto;min-height:46px;white-space:normal}
}
@media (max-width:520px){.act.main{flex-basis:28%;min-width:0;font-size:15px;padding:0 4px}.act.sub{flex:1 1 40%;min-height:64px;flex-direction:row}}
/* スマホ：うえの ひょうじを ちいさく。じこくと はやさを 1ぎょうに、ちずは ちいさく して おすと おおきく なる */
@media (max-width:640px){
  .hud{gap:8px}
  .hudMain{gap:6px}
  .hudMain>.row:first-child{flex-wrap:wrap;gap:6px;justify-content:flex-start}
  .pill{padding:4px 9px;border-radius:14px}
  .clock,.speed{gap:3px}
  .clock b{font-size:20px}.clock small{font-size:11px}
  .speed b{font-size:22px;min-width:1.6em}.speed small{font-size:11px}.speed .max{font-size:10px;margin-left:2px}
  .lineinfo{font-size:14px;gap:6px}.lineinfo small{font-size:12px}.lineinfo i{width:10px;height:10px}
  .led{height:36px;font-size:19px;line-height:30px}
  .map{position:absolute;top:40px;right:0;width:76px;padding:3px;border-radius:12px;pointer-events:auto;cursor:pointer}
  .led{margin-right:84px}
  .lineinfo{max-width:calc(100% - 88px)}
  .lineinfo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .map small{display:none}
  .map.big{top:0;width:min(82vw,320px);padding:6px;z-index:3}
  .map.big small{display:block}
}
</style>

class Trip{

  setStart(m){this.start=m;this._ls=[];this.start=Math.min(this.lastStart(),Math.max(this.firstStart(),m));this._ls=[];return this;}
  get len(){return Math.abs(this.b-this.a);}

  dest(k){/* k から k+1 へ むかうときの いきさき */const x=this.idx(k),y=this.idx(k+1),toB=this.b>this.a?y>x:y<x;return this.line.st[toB?this.b:this.a];}

  led('ただいま '+est.ja+' ため きんきゅう ていし しました  あんぜんを かくにん して います  しばらく おまち ください');
}
function emergencyResume(){
  state='running';v=0;
  carChime();announce('あんぜんが かくにん できました。まもなく、うんてんを さいかい いたします。この でんしゃは、やく'+delay+'ふん おくれて おります。','We will now resume operation. This train is running about '+delay+' minutes late.',600,true);
  const nx=st(target);led('うんてんを さいかい します  やく '+delay+'ふん おくれ  つぎは '+nx[0]+' '+fmt(arrMin(target)+delay)+'着');
}
function update(dt){
  const prevJoint=Math.floor(pos/JOINT),prevK=Math.floor(pos/SP);
  if(state==='stopped'){
    stopT+=dt;
    if(stopT>0.6&&doorAnim<1){if(doorAnim===0)doorSnd();doorAnim=Math.min(1,doorAnim+dt*1.5);}
    if(auto&&stopT>6)depart();
    else if(holding()&&stopT>3.5&&!paxBusy())depart();/* ながおし したままなら、のりおりが おわったら つぎの えきへ */
  }else if(state==='bell'){
    bellT+=dt;if(bellT>1.5&&!paxBusy()){state='closing';doorSnd();}
  }else if(state==='closing'){
    doorAnim-=dt*1.2;
    if(doorAnim<=0){doorAnim=0;startRunning();}
  }else if(state==='running'){
    if(holding()||auto)v+=ACC*dt;else v-=COAST*dt;
    {const vm=segVmax(curK());if(v>vm)v=Math.max(vm,v-BRAKE*dt);v=Math.max(0,v);}
    const rem=target*SP-pos;
    if(!announced&&rem<4200&&(!speechBusy()||rem<2600)){announced=true;approach();}
    if(rem<=v*v/(2*BRAKE)+2)state='braking';
    else pos+=v*dt;
  }
  if(state==='estop'){
    v-=420*dt;const rem=target*SP-pos;
    if(v<=0){v=0;emergencyStopped();}
    else{const step=v*dt;if(step>=rem){stopSqueal();delay+=2;arrive();}else pos+=step;}
  }else if(state==='estopWait'){
    estT+=dt;if(estT>7&&(!speechBusy()||estT>16))emergencyResume();
  }
  if(state==='braking'){
    const rem=target*SP-pos;
    if(!announced){announced=true;approach();}
    if(rem<=0.5){arrive();}
    else{
      v-=(v*v/(2*rem))*dt;if(v<25)v=25;
      const step=v*dt;
      if(step>=rem)arrive();else pos+=step;
    }
  }
  {const nk=Math.floor(pos/SP);for(let k=prevK+1;k<=nk;k++)stationReached(k);}
  paxUpdate(dt);
  if(v>40&&Math.floor(pos/JOINT)!==prevJoint)clack();
  if(hornT>0)hornT-=dt;
  if(crewT>0)crewT-=dt;
  if(AC&&motorGain){
    const r=v/MAXV,t=AC.currentTime;
    motorOsc.frequency.setTargetAtTime(110+r*700,t,0.1);
    motorFilt.frequency.setTargetAtTime(300+r*1600,t,0.1);
    motorGain.gain.setTargetAtTime(v>1?0.025+0.035*r:0,t,0.15);
  }
}

/* ---------- じかんの いろ（そら・くらさ） ---------- */
const SKY=[[0,'#0b1430','#1c2a55'],[290,'#0b1430','#1c2a55'],[340,'#2c3f7a','#e9946a'],[400,'#5cbcff','#dff4ff'],[960,'#5cbcff','#dff4ff'],[1030,'#4a68b0','#f5a76c'],[1090,'#1f2b5c','#c46a6a'],[1140,'#0b1430','#1c2a55'],[1440,'#0b1430','#1c2a55']];
const DARK=[[0,1],[290,1],[350,0.45],[410,0],[980,0],[1060,0.4],[1140,1],[1440,1]];
function hx(c){const n=parseInt(c.slice(1),16);return[n>>16,(n>>8)&255,n&255];}
function mix(a,b,f){const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*f).toString(16).padStart(2,'0')).join('');}
function keyAt(tab,m,i){for(let j=0;j<tab.length-1;j++){const a=tab[j],b=tab[j+1];if(m>=a[0]&&m<=b[0]){const f=(m-a[0])/((b[0]-a[0])||1);return typeof a[i]==='number'?a[i]+(b[i]-a[i])*f:mix(a[i],b[i],f);}}return tab[0][i];}

/* ---------- くかんごとの けしき ---------- */
const CITY=new Set(['東京','品川','上野','大宮','新横浜','名古屋','京都','新大阪','新神戸','博多','仙台','広島','岡山','熊本','金沢','新潟','鹿児島中央','長野','小倉','長崎','富山','宇都宮','盛岡','秋田','山形','姫路','静岡','浜松']);
function sceneFor(k){
  const [L,i]=segInfo(Math.min(idx(k),idx(k+1))),inR=(x,y)=>i>=x&&i<=y;
  const sc={far:'rolling',near:'field',snow:false};
  if(L==='tokaido'){sc.near='town';if(i===3||i===9)sc.far='sea';if(inR(4,6))sc.far='fuji';}
  else if(L==='sanyo'){sc.near='town';if(i===1||inR(7,9)||i===12)sc.far='sea';}
  else if(L==='kyushu'){if(inR(5,6)||i===10)sc.far='volcano';if(inR(8,9))sc.far='sea';}
  else if(L==='nishikyushu'){if(inR(2,3))sc.far='sea';}
  else if(L==='tohoku'){if(inR(5,6)||i===9||inR(18,19))sc.far='range';if(inR(19,21))sc.near='orchard';}
  else if(L==='hokkaido'){sc.far=i===0?'range':'sea';}
  else if(L==='yamagata'){if(i>=5)sc.far='range';if(inR(10,12))sc.near='orchard';}
  else if(L==='akita'){if(i>=10){sc.far='range';sc.snow=true;}}
  else if(L==='joetsu'){if(inR(5,7)){sc.far='range';sc.snow=true;}}
  else if(L==='hokuriku'){if(inR(6,8))sc.far='volcano';if(inR(14,16)){sc.far='range';sc.snow=true;}if(i===13)sc.far='sea';}
  return sc;
}
function cityness(){const k=Math.floor(pos/SP);let c=0;[k,k+1].forEach(j=>{if(CITY.has(st(j)[0]))c=Math.max(c,1-Math.abs(pos-j*SP)/3200);});return Math.max(0,c);}
let farCur='rolling|0',farPrev='rolling|0',farF=1,lastBgT=0;

function cloud(x,y,k){ctx.fillStyle=night>0.5?'rgba(150,160,190,.35)':(night>0?'rgba(255,236,220,.85)':'rgba(255,255,255,.92)');ctx.beginPath();ctx.arc(x,y,22*k,0,7);ctx.arc(x+26*k,y-10*k,28*k,0,7);ctx.arc(x+56*k,y,22*k,0,7);ctx.rect(x,y,56*k,22*k);ctx.fill();}

    for(let i=Math.floor((o-300)/700);i<=Math.floor((o+bw+300)/700);i++){if(hash(i+40)<0.45)continue;const x=i*700+hash(i)*300-o,w=60+hash(i+9)*120,h=12+hash(i+3)*26;

      else{cone(x,ty-215,300,tint('#6f7f6c'));ctx.fillStyle=tint('#5a6658');ctx.fillRect(x-40,ty-217,80,5);
        for(let j=0;j<6;j++){const ph=((t*0.12+j/6)%1),r=12+ph*34;ctx.fillStyle='rgba(230,230,235,'+(0.55*(1-ph))+')';ctx.beginPath();ctx.arc(x+ph*60+Math.sin(j)*8,ty-225-ph*120,r,0,7);ctx.fill();}}

const mcv=$('mapcv'),mctx=mcv.getContext('2d');let mapOn=true,mapBase=null,mapSize=0,proj=null;
function buildMap(){
  const r=mcv.getBoundingClientRect();if(!r.width)return;
  const d=Math.min(2,window.devicePixelRatio||1);mapSize=r.width;mcv.width=Math.round(r.width*d);mcv.height=Math.round(r.width*d);
  let la0=99,la1=0,lo0=999,lo1=0;line.st.map(x=>POS[x[0]]).filter(Boolean).forEach(([a,o])=>{la0=Math.min(la0,a);la1=Math.max(la1,a);lo0=Math.min(lo0,o);lo1=Math.max(lo1,o);});
  const k=Math.cos(36.5*Math.PI/180),pad=14,w=Math.max(2.6,(lo1-lo0)*k),h=Math.max(2.6,la1-la0),sc=(mapSize-pad*2)/Math.max(w,h)*0.82;
  const cxm=(lo0+lo1)/2,cym=(la0+la1)/2;lo0=cxm-mapSize/2/sc/k;la1=cym+mapSize/2/sc;const ox=0,oy=0;
  proj=n=>{const p=POS[n];return p?[ox+(p[1]-lo0)*k*sc,oy+(la1-p[0])*sc]:null;};
  mapBase=document.createElement('canvas');mapBase.width=mcv.width;mapBase.height=mcv.height;
  const g=mapBase.getContext('2d');g.setTransform(d,0,0,d,0,0);
  g.fillStyle='#cfe8fb';g.fillRect(0,0,mapSize,mapSize);
  const pj=(lo,la)=>[(lo-lo0)*k*sc,(la1-la)*sc];
  g.fillStyle='#f4efd9';g.strokeStyle='#a9b98f';g.lineWidth=1;g.lineJoin='round';
  JP_LAND.forEach(r=>{g.beginPath();r.split(' ').forEach((q,i)=>{const [lo,la]=q.split(',').map(Number);const [x,y]=pj(lo,la);i?g.lineTo(x,y):g.moveTo(x,y);});g.closePath();g.fill();g.stroke();});
  const path=(l)=>{g.beginPath();l.st.forEach((s,i)=>{const q=proj(s[0]);if(q){i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);}});};
  g.lineCap='round';g.lineJoin='round';
  LINES.forEach(l=>{if(l===line)return;path(l);g.strokeStyle='#b7c3d3';g.lineWidth=2;g.stroke();});
  path(line);g.strokeStyle=line.c;g.lineWidth=4;g.stroke();
  line.st.forEach(s=>{const q=proj(s[0]);if(!q)return;g.fillStyle='#fff';g.strokeStyle=line.c;g.lineWidth=1.5;g.beginPath();g.arc(q[0],q[1],2.6,0,7);g.fill();g.stroke();});
  g.fillStyle='#14213d';g.font='800 10px '+FONT;g.textBaseline='middle';
  [line.st[0],line.st[line.st.length-1]].forEach(s=>{const q=proj(s[0]);if(!q)return;const right=q[0]<mapSize*0.6;g.textAlign=right?'left':'right';g.fillText(s[0],q[0]+(right?6:-6),q[1]);});
}
function drawMap(t){
  if(!mapOn)return;
  if(!mapBase||Math.abs(mcv.getBoundingClientRect().width-mapSize)>1)buildMap();
  if(!mapBase)return;
  const d=mcv.width/mapSize;mctx.setTransform(1,0,0,1,0,0);mctx.drawImage(mapBase,0,0);mctx.setTransform(d,0,0,d,0,0);
  const run=moving(),k=run?curK():Math.round(pos/SP),f=run?Math.max(0,Math.min(1,(pos-k*SP)/SP)):0;
  const a=proj(st(k)[0]),b=proj(st(k+1)[0]);if(!a||!b)return;
  const x=a[0]+(b[0]-a[0])*f,y=a[1]+(b[1]-a[1])*f,pr=reduced?0:(Math.sin(t*4)+1)*2;
  mctx.fillStyle='rgba(230,40,60,.25)';mctx.beginPath();mctx.arc(x,y,7+pr,0,7);mctx.fill();
  mctx.fillStyle='#e6283c';mctx.strokeStyle='#fff';mctx.lineWidth=2;mctx.beginPath();mctx.arc(x,y,5,0,7);mctx.fill();mctx.stroke();
}

function renderTT(){

  const cur=atStation()?Math.round(pos/SP):target-1;
  const L=Math.floor(cur/legLen()),k0=L*legLen(),hi=atStation()?cur:target;
  const tb=$('ttBody');tb.textContent='';
  for(let j=0;j<=legLen();j++){const k=k0+j,n=st(k),tr=document.createElement('tr');if(k===hi)tr.className='now';
    const a=document.createElement('td'),b=document.createElement('td'),c=document.createElement('td');
    a.textContent=n[0];const sm=document.createElement('small');sm.textContent=n[1];a.appendChild(sm);
    b.className='t';c.className='t';if(!isStop(k)){b.textContent='レ';c.textContent='レ';tr.className=(tr.className+' pass').trim();}else{
      const dA=(k in delayLog)?delayLog[k]:delay,dD=(k in depLog)?depLog[k]:delay;

      if(j>0)put(b,arrMin(k),dA);if(j<legLen())put(c,depMin(k),dD);}
    tr.append(a,b,c);tb.appendChild(tr);}
}

  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);

}

 {t:'ありがとう',d:'ごりようの おれい',f:()=>['きょうも しんかんせんを ごりよう くださいまして、ありがとう ございます。','Thank you for using the Shinkansen.','きょうも しんかんせんを ごりよう くださいまして ありがとうございます']}
];

const fsBtn=$('fsBtn'),root=document.documentElement;
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsOK=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled)&&!!(root.requestFullscreen||root.webkitRequestFullscreen);

/* iPad の Safari は ぜんがめんの とき 左上に かいじょボタンを かさねて だすので、そのあいだだけ よける */
const isIPad=/iPad/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);

  else{const r=(root.requestFullscreen||root.webkitRequestFullscreen).call(root);if(r&&r.catch)r.catch(()=>{fsBtn.hidden=true;});}
}catch(e){fsBtn.hidden=true;}});

  if(master)master.gain.setTargetAtTime(soundOn?0.8:0,AC.currentTime,0.05);if(!soundOn)stopSpeech();}

  if(anyPanel()){if(e.key==='Escape')PANELS.forEach(closePanel);return;}
  const b=e.target.closest&&e.target.closest('button');
  if(b&&b!==goBtn)return;
  if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();if(!e.repeat)press('k');}
  else if(e.key==='h'||e.key==='H'){horn();}

function start(data){
  const d=Object.assign({},load(),data||{});
  if(d.paint&&typeof d.paint==='object'){PARTS.forEach(([k,,pal])=>{if(pal.some(x=>x[1]===d.paint[k]))paint[k]=d.paint[k];});if(d.paint.body&&BODY.some(x=>x[1]===d.paint.body)){paint.up=d.paint.body;paint.low=d.paint.body;}}
  else if(d.colorIdx>=0&&d.colorIdx<3){const c=['#1f5fbf','#d6283c','#139a57'][d.colorIdx];paint.line=c;}
  auto=!!d.auto;let startMin;{const hs=data&&data.startMin;if(Number.isInteger(hs)&&hs>=300&&hs<1440)startMin=hs;else{const now=new Date();startMin=Math.round((now.getHours()*60+now.getMinutes())/5)*5;}}if(typeof d.mapOn==='boolean')mapOn=d.mapOn;applyMap();if(typeof d.soundOn==='boolean')soundOn=d.soundOn;
  setTrip(new Trip(LINES.find(l=>l.id===d.lineId)||LINES[0],d.tripA,d.tripB,startMin,d.fast),false);
  autoBtn.setAttribute('aria-pressed',auto);applySound();applyColor();
  const hot=window.claude&&window.claude.hot;
  if(hot&&hot.snapshot){try{hot.snapshot(()=>({paint,auto,soundOn,mapOn,startMin:trip.start,tripA:trip.a,tripB:trip.b,fast:trip.fast,lineId:line.id}));}catch(e){}}
  resize();
  if(document.fonts&&document.fonts.load){document.fonts.load('800 28px "M PLUS Rounded 1c"').catch(()=>{});}
  requestAnimationFrame(frame);
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data?hot.data:{});
})();
