<!doctype html><meta charset="utf-8"><title>山手線：運転の確認</title>
<style>body{font:16px system-ui;background:#edf3f7;color:#14213d;margin:16px}button{padding:14px;font:inherit}pre{white-space:pre-wrap}iframe{display:block;border:0;margin-top:16px;max-width:none}</style>
<button id="run">確認する</button><pre id="result">待機中</pre><div id="frames"></div>
<script>
/* 本番の保存データ（localStorage の 'yamanote'）は使わず、別のキーで動かす。
   ?preview=fall・?preview=missed・?preview=goal で、その場面を止めて見られる。 */
const result=document.querySelector('#result'),frames=document.querySelector('#frames'),params=new URLSearchParams(location.search);
let count=0,frame,key;
function check(ok,message){if(!ok)throw Error(message);count++;result.textContent+='\n✓ '+message;}
async function mount(width,height){
  frame?.remove();key='yamanote-test-'+Date.now();
  localStorage.setItem(key,JSON.stringify({auto:true,soundOn:false,mapOn:true,lineId:'yamanote',tripA:0,tripB:16,ti:0,ser:'E235'}));
  let source=await(await fetch('../yamanote.html')).text();
  source=source.replace("localStorage.setItem('yamanote',","localStorage.setItem("+JSON.stringify(key)+",").replace("localStorage.getItem('yamanote')","localStorage.getItem("+JSON.stringify(key)+")").replace('<script>','<script>Math.random=()=>.6;window.requestAnimationFrame=()=>0;');
  const marker='if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data?hot.data:{});';
  if(!source.includes(marker))throw Error('QA insertion point not found');
  source=source.replace(marker,marker+`const clipCalls=[];const originalPlay=playClip;playClip=name=>{clipCalls.push(name);return originalPlay(name)};
  let gateOpening,crewStations=[],seen=new Set(),crossings=new Set();
  const gates=drawPlatformDoors,platformCrew=drawPlatformCrew;
  drawPlatformDoors=(c,y,opening)=>{gateOpening=opening;gates(c,y,opening);};
  drawPlatformCrew=(k,camX)=>{crewStations.push(st(k)[0]);platformCrew(k,camX);};
  window.qa={
    get state(){return {state,pos,target,doorAnim,people,busy:paxBusy(),elevation:elevationAt(trip,pos),clipCalls,k:kNear(pos),name:st(kNear(pos))[0],goalK:trip.goalK,lap:trip.len};},
    get visual(){return {gateOpening,crewStations};},
    get seen(){return seen},get crossings(){return crossings},
    trip(from,to,dir){const R=ROUTES[0];setTrip(new Trip(R,stIndex(R,from),stIndex(R,to),600,dir,'E235'),false);seen=new Set();crossings=new Set();},
    force(){people.forEach(p=>p.willTrip=false);const p=pickStumbler(people,()=>0);if(!p)throw Error('No candidate');p.willTrip=true;return p;},
    step(seconds){for(let i=0;i<Math.ceil(seconds/.05);i++){gateOpening=undefined;crewStations=[];this.tick=(this.tick||1000)+50;frame(this.tick);
      if(state==='stopped')seen.add(st(kNear(pos))[0]);
      const k=kAt(pos);for(const j of [k,k+1])if(feat(j).cr.length)crossings.add(st(j)[0]+'|'+st(j+1)[0]);}},
  };`);
  frame=document.createElement('iframe');frame.title='隔離した確認用ゲーム';frame.style.width=width+'px';frame.style.height=height+'px';frames.replaceChildren(frame);
  const loaded=new Promise(resolve=>frame.onload=resolve);frame.srcdoc=source;await loaded;await frame.contentDocument.fonts.ready;
  const w=frame.contentWindow,d=frame.contentDocument,errors=[];w.addEventListener('error',e=>errors.push(e.message));
  if(!w.qa)throw Error('Game did not start');d.querySelector('#tStart').click();
  return {w,d,qa:w.qa,errors};
}
function pointer(w,d,type){d.querySelector('#go').dispatchEvent(new w.PointerEvent(type,{pointerId:1,pointerType:'touch',isPrimary:true,bubbles:true,button:0,buttons:type==='pointerup'?0:1}));}
const label=d=>d.querySelector('#bannerLabel').textContent;
document.querySelector('#run').onclick=async()=>{
  document.querySelector('#run').disabled=true;count=0;result.textContent='確認中';
  const realSave=localStorage.getItem('yamanote');
  try{
    const sizes=params.has('preview')?[[1024,768]]:[[400,844],[1024,768]];
    for(const [width,height] of sizes){
      const {w,d,qa,errors}=await mount(width,height);check(w.innerWidth===width,'画面幅 '+width);
      check(d.querySelector('#typeBadge').textContent==='内回り'&&d.querySelector('#destName').textContent==='上野・池袋方面','内回り 上野・池袋方面 と表示する');
      /* 乗り遅れる人 */
      if(!params.has('preview')||['fall','missed'].includes(params.get('preview'))){
        qa.trip('東京','新宿',0);qa.step(.05);
        const person=qa.force();pointer(w,d,'pointerdown');qa.step(.5);
        check(person.kind==='stumble','乗車時につまずいて転ぶ');
        if(params.get('preview')==='fall'){result.textContent='転ぶ場面（確認用・本番の保存データとは別）';return;}
        qa.step(4);pointer(w,d,'pointerup');
        check(person.kind==='missed'&&person.departed&&qa.state.state==='running','発車した電車をホームで見送る');
        if(params.get('preview')==='missed'){result.textContent='見送る場面（確認用・本番の保存データとは別）';return;}
        check(qa.state.clipCalls.filter(n=>n==='ah').length===1,'転んだ瞬間の声は1回だけ');
      }
      /* いっしゅう：外回りで 駒込から 駒込まで。30駅に とまり、ゴールで「いっしゅう」と でる */
      qa.trip('駒込','駒込',1);qa.step(.05);
      check(d.querySelector('#typeBadge').textContent==='外回り'&&d.querySelector('#destName').textContent==='上野・東京方面','外回り（駒込から田端・上野の方へ）上野・東京方面 と表示する');
      let goal=false,maxStep=0,prevH=qa.state.elevation,shinjukuDoors=null,tokyoDoors=null;
      for(let i=0;i<60000&&!goal;i++){qa.step(.05);
        maxStep=Math.max(maxStep,Math.abs(qa.state.elevation-prevH));prevH=qa.state.elevation;
        if(qa.state.state==='stopped'&&qa.state.doorAnim===1){if(qa.state.name==='新宿')shinjukuDoors=qa.visual.gateOpening;if(qa.state.name==='東京')tokyoDoors=qa.visual.gateOpening;}
        if(qa.state.state==='stopped'&&qa.state.k===30&&label(d).includes('いっしゅう'))goal=true;}
      check(goal,'駒込から外回りで一周して駒込に戻り「いっしゅう」と出る');
      check(qa.seen.size===30,'30駅すべてに停車する（'+qa.seen.size+'駅）');
      check(maxStep<.05,'東京駅のつなぎめを含め、線路の高さが段差なく変わる');
      check(shinjukuDoors===undefined,'新宿ではホームドアを描かない');
      check(tokyoDoors===1,'東京ではホームドアが車両のドアと一緒に開く');
      check([...qa.crossings].every(p=>['駒込|田端','田端|駒込'].includes(p))&&qa.crossings.size>0,'踏切は駒込〜田端だけ');
      if(params.get('preview')==='goal')return;
      qa.step(30);check(qa.state.k>30,'ゴールの後もそのまま走り続ける');
      /* 内回りで 東京→新宿：ゴールで止まらず次の駅へ */
      qa.trip('東京','新宿',0);let atGoal=false;
      for(let i=0;i<40000&&!atGoal;i++){qa.step(.05);if(qa.state.state==='stopped'&&qa.state.k===16&&label(d).includes('ゴール'))atGoal=true;}
      check(atGoal&&qa.state.name==='新宿','内回り 東京→新宿で新宿がゴールになる');
      check(d.querySelector('#ledText').textContent.includes('ゴール'),'車内表示にゴールが出る');
      const rect=d.querySelector('#doorBtn').getBoundingClientRect();
      check(rect.left>=0&&rect.right<=width&&rect.height>=44,'ドアボタンが画面内に収まりタッチできる');
      check(errors.length===0,'実行時エラーなし');
      localStorage.removeItem(key);
    }
    check(localStorage.getItem('yamanote')===realSave,'既存の保存データを変更しない');
    result.textContent+='\n'+count+' checks passed';
  }catch(e){result.textContent+='\nFAIL '+e.stack;result.style.color='#b31828';}
  finally{if(key)localStorage.removeItem(key);document.querySelector('#run').disabled=false;}
};
if(params.has('preview'))document.querySelector('#run').click();
</script>
