<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ソウスケゲームズ</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="description" content="子ども向けのミニゲーム">
<meta name="theme-color" content="#8fd0ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* ゲームを えらぶ ページ。ゲームを ふやすときは <ul class="games"> の「もうすぐ」の まえに <li> を たす */
:root{
  color-scheme:light;
  --sky:#8fd0ff;
  --sky2:#d8f0ff;
  --grass:#7cc576;
  --grass2:#5fae5a;
  --panel:#ffffff;
  --ink:#14213d;
  --sub:#4a5878;
  --go:#ffcf33;
  --go-ink:#3a2a00;
  --shadow:rgba(20,33,61,.2);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{position:relative;min-height:100vh;min-height:100dvh;overflow-x:hidden;color:var(--ink);font-family:var(--font);
  background:linear-gradient(var(--sky) 0%,var(--sky2) 70%);
  padding:28px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}

/* そら：たいよう と くも */
.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.sun{position:absolute;top:22px;right:6%;width:84px;height:84px;border-radius:50%;background:#ffe27a;
  box-shadow:0 0 0 14px rgba(255,226,122,.35),0 0 0 30px rgba(255,226,122,.18);animation:spin 18s linear infinite}
.cloud{position:absolute;left:-200px;width:150px;height:46px;border-radius:999px;background:#fff;opacity:.95;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:64px;height:64px;left:22px;top:-30px}
.cloud::after{width:48px;height:48px;left:72px;top:-20px}
.c1{top:70px;animation-duration:46s;animation-delay:-8s}
.c2{top:190px;transform:scale(.7);animation-duration:60s;animation-delay:-34s}
.c3{top:330px;transform:scale(.85);animation-duration:52s;animation-delay:-20s}
@keyframes drift{to{left:calc(100% + 200px)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* じめん */
.ground{position:absolute;left:0;right:0;bottom:0;height:90px;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 10% 0,var(--grass2) 0 28px,transparent 29px),radial-gradient(circle at 60% 0,var(--grass2) 0 40px,transparent 41px),var(--grass)}
.flowers{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:space-around;font-size:26px}

main{position:relative;z-index:1}

/* タイトル：1もじずつ いろが ちがって ぴょんぴょん */
h1{margin:6px 0 4px;text-align:center;font-size:clamp(30px,10vw,64px);font-weight:800;line-height:1.2}
h1 span{display:inline-block;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;
  text-shadow:0 5px 0 var(--ink);animation:hop 1.6s ease-in-out infinite}
h1 span:nth-child(1){color:#ff6b6b;animation-delay:0s}
h1 span:nth-child(2){color:#ffa53d;animation-delay:.1s}
h1 span:nth-child(3){color:#ffd23d;animation-delay:.2s}
h1 span:nth-child(4){color:#5cc85c;animation-delay:.3s}
h1 span:nth-child(5){color:#3d8bff;animation-delay:.4s}
h1 span:nth-child(6){color:#8a6bff;animation-delay:.5s}
h1 span:nth-child(7){color:#ff7ac0;animation-delay:.6s}
h1 span:nth-child(8){color:#36c9c6;animation-delay:.7s}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}}
.lead{margin:0 0 28px;text-align:center;font-size:clamp(17px,4.5vw,22px);font-weight:800}
.lead b{display:inline-block;background:var(--panel);padding:6px 18px;border-radius:999px;box-shadow:0 4px 0 var(--shadow)}

/* ゲームの カード */
.games{list-style:none;margin:0 auto;padding:0;max-width:960px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:26px}
.games>li:nth-child(odd) .card{rotate:-1.5deg}
.games>li:nth-child(even) .card{rotate:1.5deg}
.card{display:flex;flex-direction:column;height:100%;background:var(--panel);color:inherit;text-decoration:none;border:5px solid var(--ink);border-radius:28px;overflow:hidden;
  box-shadow:0 8px 0 var(--ink);transition:transform .15s;-webkit-tap-highlight-color:transparent}
a.card:hover{transform:translateY(-4px) scale(1.02);animation:wiggle .5s ease-in-out}
a.card:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
a.card:focus-visible{outline:6px solid var(--go);outline-offset:4px}
@keyframes wiggle{25%{rotate:-3deg}75%{rotate:3deg}}
.pic{display:block;width:100%;height:auto;aspect-ratio:16/9;background:var(--sky);border-bottom:5px solid var(--ink)}
.pic .train{animation:rock 1.2s ease-in-out infinite}
@keyframes rock{50%{transform:translateY(-2px)}}
.body{padding:14px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.name{margin:0;font-size:24px;font-weight:800;word-break:keep-all;overflow-wrap:anywhere}
.desc{margin:0;color:var(--sub);font-size:16px;line-height:1.6;flex:1}
.play{align-self:center;margin-top:6px;display:inline-flex;align-items:center;gap:8px;background:var(--go);color:var(--go-ink);font-weight:800;font-size:22px;
  padding:10px 30px;border:4px solid var(--ink);border-radius:999px;box-shadow:0 5px 0 var(--ink)}
.play::after{content:"";border-left:14px solid currentColor;border-top:9px solid transparent;border-bottom:9px solid transparent}

/* もうすぐ ふえるよ */
.soon{align-items:center;justify-content:center;gap:10px;min-height:260px;background:rgba(255,255,255,.55);border-style:dashed;box-shadow:none;color:var(--sub);text-align:center}
.soon .q{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:4px dashed var(--sub);font-size:44px;font-weight:800}
.soon p{margin:0;font-size:18px;font-weight:800}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
</div>
<div class="ground" aria-hidden="true"><div class="flowers"><span>🌷</span><span>🌼</span><span>🌷</span><span>🌼</span><span>🌷</span></div></div>

<main>
  <h1 aria-label="ソウスケゲームズ"><span>ソ</span><span>ウ</span><span>ス</span><span>ケ</span><span>ゲ</span><span>ー</span><span>ム</span><span>ズ</span></h1>
  <p class="lead"><b>あそびたい ゲームを えらんでね！</b></p>

  <ul class="games">
    <li>
      <a class="card" href="shinkansen-untenshi/shinkansen.html">
        <svg class="pic" viewBox="0 0 320 180" aria-hidden="true">
          <rect width="320" height="120" fill="#8fd0ff"/>
          <path d="M0 120 L60 84 L110 110 L170 72 L240 112 L320 90 L320 120Z" fill="#7cc576"/>
          <rect y="120" width="320" height="60" fill="#9fd68f"/>
          <rect y="150" width="320" height="6" fill="#c3ccd9"/>
          <g fill="#8a6a4a"><rect x="10" y="156" width="10" height="6"/><rect x="60" y="156" width="10" height="6"/><rect x="110" y="156" width="10" height="6"/><rect x="160" y="156" width="10" height="6"/><rect x="210" y="156" width="10" height="6"/><rect x="260" y="156" width="10" height="6"/><rect x="310" y="156" width="10" height="6"/></g>
          <g class="train">
            <path d="M24 150 H244 C276 150 300 142 312 130 C296 114 268 106 236 106 H24 Z" fill="#ffffff" stroke="#14213d" stroke-width="3" stroke-linejoin="round"/>
            <path d="M24 136 H302" stroke="#3d8bff" stroke-width="6"/>
            <path d="M236 110 C262 110 284 116 298 126 H238 Z" fill="#14213d"/>
            <g fill="#14213d"><rect x="40" y="116" width="22" height="12" rx="3"/><rect x="72" y="116" width="22" height="12" rx="3"/><rect x="104" y="116" width="22" height="12" rx="3"/><rect x="136" y="116" width="22" height="12" rx="3"/><rect x="168" y="116" width="22" height="12" rx="3"/><rect x="200" y="116" width="22" height="12" rx="3"/></g>
          </g>
          <g fill="#fff" opacity=".8"><rect x="0" y="118" width="14" height="3" rx="1.5"/><rect x="2" y="128" width="10" height="3" rx="1.5"/><rect x="0" y="140" width="16" height="3" rx="1.5"/></g>
        </svg>
        <div class="body">
          <h2 class="name">しんかんせん うんてんし</h2>
          <p class="desc">しんかんせんを うんてんしよう！ えきで のりおり、アナウンス、じこくひょうも あるよ。</p>
          <span class="play">あそぶ</span>
        </div>
      </a>
    </li>
    <li>
      <div class="card soon">
        <div class="q" aria-hidden="true">？</div>
        <p>もうすぐ<br>ふえるよ！</p>
      </div>
    </li>
  </ul>
</main>
</body>
</html>
