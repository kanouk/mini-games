<!doctype html><meta charset="utf-8"><title>西武線：乗降アニメーション確認</title>
<style>body{font:16px system-ui;background:#edf3f7;color:#14213d;margin:16px}button{padding:14px;font:inherit}pre{white-space:pre-wrap}iframe{display:block;border:0;margin-top:16px;max-width:none}</style>
<button id="run">確認する</button><pre id="result">待機中</pre><div id="frames"></div>
<script>
const result=document.querySelector('#result'),frames=document.querySelector('#frames'),params=new URLSearchParams(location.search);
let count=0,frame,key;
function check(ok,message){if(!ok)throw Error(message);count++;result.textContent+='\n✓ '+message;}
async function mount(width,height){
  frame?.remove();key='seibu-boarding-test-'+Date.now();
  localStorage.setItem(key,JSON.stringify({auto:false,soundOn:false,mapOn:true,lineId:'ikebukuro',tripA:3,tripB:4,ti:0,ser:'40000'}));
  let source=await(await fetch('../seibu.html')).text();
  source=source.replaceAll("'seibu'",JSON.stringify(key)).replace('<script>','<script>Math.random=()=>.6;window.requestAnimationFrame=()=>0;');
  const marker='if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data?hot.data:{});';
  if(!source.includes(marker))throw Error('QA insertion point not found');
  source=source.replace(marker,marker+`const clipCalls=[];const originalPlay=playClip;playClip=name=>{clipCalls.push(name);return originalPlay(name)};window.qa={
    get state(){return {state,pos,target,doorAnim,people,busy:paxBusy(),elevation:elevationAt(trip,pos),change:driverChange,waiting:waitingDriver,remaining:X(target)-pos,front:pos+FRONT,clipCalls};},
    async audio(){await clipsReady;return {ah:clipBuffers.ah?.duration,handover:clipBuffers.handover?.duration};},
    nerima(){const R=ROUTES.find(r=>r.id==='yurakucho');setTrip(new Trip(R,stIndex(R,'新桜台'),stIndex(R,'中村橋'),600,0,'6000'),false);},
    toshima(from,to){const R=ROUTES.find(r=>r.id==='toshima');setTrip(new Trip(R,stIndex(R,from),stIndex(R,to),600,0,'30000'),false);},
    levelAt(offset){return elevationAt(trip,pos+offset);},
    undergroundTrip(){const R=ROUTES.find(r=>r.id==='yurakucho');setTrip(new Trip(R,stIndex(R,'練馬'),stIndex(R,'小竹向原'),600,0,'6000'),false);},
    trackHeight(){return groundY-railY(pos);},
    hoya(){const R=ROUTES[0];setTrip(new Trip(R,stIndex(R,'大泉学園'),stIndex(R,'ひばりヶ丘'),600,0,'40000'),false);},
    force(){people.forEach(p=>p.willTrip=false);const p=pickStumbler(people,()=>0);if(!p)throw Error('No candidate');p.willTrip=true;return p;},
    step(seconds){for(let i=0;i<Math.ceil(seconds/.05);i++){this.tick=(this.tick||1000)+50;frame(this.tick);}},
  };`);
  frame=document.createElement('iframe');frame.title='隔離した確認用ゲーム';frame.style.width=width+'px';frame.style.height=height+'px';frames.replaceChildren(frame);
  const loaded=new Promise(resolve=>frame.onload=resolve);frame.srcdoc=source;await loaded;await frame.contentDocument.fonts.ready;
  const w=frame.contentWindow,d=frame.contentDocument,errors=[];w.addEventListener('error',e=>errors.push(e.message));
  if(!w.qa)throw Error('Game did not start');d.querySelector('#tStart').click();
  return {w,d,qa:w.qa,errors};
}
function pointer(w,d,type){d.querySelector('#go').dispatchEvent(new w.PointerEvent(type,{pointerId:1,pointerType:'touch',isPrimary:true,bubbles:true,button:0,buttons:type==='pointerup'?0:1}));}
document.querySelector('#run').onclick=async()=>{
  document.querySelector('#run').disabled=true;count=0;result.textContent='確認中';
  const realSave=localStorage.getItem('seibu');
  try{
    const sizes=params.has('preview')?[[1024,768]]:[[400,844],[1024,768]];
    for(const [width,height] of sizes){
      const {w,d,qa,errors}=await mount(width,height);check(w.innerWidth===width,'画面幅 '+width);
      if(params.get('preview')==='toshima'){
        for(const [from,to,station,level] of [['豊島園','桜台','練馬',1],['練馬','豊島園','豊島園',0]]){
          qa.toshima(from,to);pointer(w,d,'pointerdown');qa.step(3);
          let previous=qa.levelAt(0),maxStep=0,sawSlope=false;
          for(let i=0;i<1800&&qa.state.state!=='stopped';i++){
            qa.step(.05);
            const next=qa.levelAt(0);
            maxStep=Math.max(maxStep,Math.abs(previous-next));previous=next;
            sawSlope ||= next>0&&next<1;
          }
          pointer(w,d,'pointerup');
          check(sawSlope&&maxStep<.05,from+'から'+station+'まで高さが滑らかに変わる');
          check(qa.state.state==='stopped'&&d.querySelector('#bannerLabel').textContent.includes(station)
            &&[-310,0,310].every(dx=>qa.levelAt(dx)===level),station+'のホームと同じ高さで停車する');
        }
        check(errors.length===0,'実行時エラーなし');
        result.textContent+='\n豊島線の両方向を確認完了';
        return;
      }
      if(['underground','shin-sakuradai'].includes(params.get('preview'))){
        qa.undergroundTrip();qa.step(.05);
        check(qa.trackHeight()>0,'練馬の線路は地上より高い');
        for(const station of ['新桜台','小竹向原']){
          qa.step(2); // 到着時はホームでドアが開くまで待つ。
          pointer(w,d,'pointerdown');qa.step(3);
          let height=qa.trackHeight(),maxStep=0;
          for(let i=0;i<1800&&qa.state.state!=='stopped';i++){
            qa.step(.05);
            maxStep=Math.max(maxStep,Math.abs(height-qa.trackHeight()));height=qa.trackHeight();
          }
          pointer(w,d,'pointerup');
          check(qa.state.state==='stopped'&&d.querySelector('#bannerLabel').textContent.includes(station),station+'に到着する');
          check(qa.trackHeight()<-100&&maxStep<7,station+'まで段差なく地下を走る');
          if(station==='新桜台'&&params.get('preview')==='shin-sakuradai')break;
        }
        check(errors.length===0,'実行時エラーなし');
        result.textContent+='\n地下区間の確認完了';
        return;
      }
      if(params.get('preview')==='nerima'){
        qa.nerima();pointer(w,d,'pointerdown');
        qa.step(3);
        for(let i=0;i<100&&qa.state.state!=='stopped';i++)qa.step(.5);
        pointer(w,d,'pointerup');
        check(qa.state.state==='stopped'&&d.querySelector('#bannerLabel').textContent.includes('練馬'),'新桜台から練馬に到着する');
        check([-310,0,310].every(offset=>qa.levelAt(offset)===1),'練馬のホーム全体で線路が同じ高さになる');
        check(errors.length===0,'実行時エラーなし');
        result.textContent+='\n新桜台から練馬へ到着（確認用）';
        return;
      }
      const person=qa.force();pointer(w,d,'pointerdown');qa.step(.5);
      check(person.kind==='stumble'&&person.t>0,'乗車時につまずいて転ぶ');
      check(qa.state.people.filter(p=>p.kind==='stumble').length===1,'転ぶ人は1人だけ');
      check(person.a===1,'転んでも消えない');
      if(params.get('preview')==='fall'){result.textContent='転ぶ場面（確認用・本番の保存データとは別）';return;}
      qa.step(2.5);
      check(person.kind==='missed'&&person.departed,'発車した電車をホームで見送る');
      check(qa.state.people.includes(person),'発車時に乗り遅れた人を残す');
      check(qa.state.state==='running'&&!qa.state.busy,'転ぶ人がいても発車できる');
      check(person.sx===0&&qa.state.pos>0,'人はホームに残り、電車だけが進む');
      if(params.get('preview')==='missed'){result.textContent='見送る場面（確認用・本番の保存データとは別）';return;}
      qa.step(2.7);check(person.kind==='away'||person.kind==='gone','見送った後はホームを離れる');
      let arrived=false;for(let i=0;i<80;i++){qa.step(.5);if(qa.state.state==='stopped'){arrived=true;break;}}
      pointer(w,d,'pointerup');check(arrived,'次の駅まで正常に運転できる');
      check(qa.state.elevation===1,'高架の駅でも乗降できる');
      check(!qa.state.people.includes(person),'離れたホームの演出を片づける');
      check(errors.length===0,'実行時エラーなし');
      const audio=await qa.audio();check(audio.ah>.05&&audio.ah<1&&audio.handover>1&&audio.handover<5,'埋め込み音声2本を実ブラウザでデコードできる');
      check(qa.state.clipCalls.filter(n=>n==='ah').length===1,'転んだ瞬間の声は1回だけ');
      qa.hoya();pointer(w,d,'pointerdown');
      qa.step(3);const waiting=qa.state.waiting?.person,waitingX=waiting?.X;
      check(waiting?.driver&&waiting.kind==='driverWait'&&waiting.a===1,'保谷に着く前から運転士が先頭の停車位置で待つ');
      let nearHoya=false;for(let i=0;i<1200;i++){qa.step(.05);if(qa.state.remaining<20&&qa.state.waiting){nearHoya=true;break;}}
      check(nearHoya&&qa.state.state==='braking'&&waiting.X===waitingX,'停車直前までホームで同じ位置に待機する');
      const canvas=d.querySelector('#cv'),cr=canvas.getBoundingClientRect(),scale=Math.min(cr.height/400,cr.width/580),waitingScreenX=cr.width/2+(waiting.X-qa.state.pos)*scale;
      check(waitingScreenX>0&&waitingScreenX<width,'到着前に待機中の運転士が画面に入る');
      if(params.get('preview')==='waiting'){result.textContent='保谷駅で到着を待つ運転士（確認用・本番の保存データとは別）';return;}
      let atHoya=false;for(let i=0;i<120;i++){qa.step(.5);if(qa.state.change){atHoya=true;break;}}
      check(atHoya&&qa.state.state==='stopped','保谷への実際の到着で運転士交代が始まる');
      check(qa.state.change.next===waiting&&qa.state.waiting===null,'ホームで待っていた運転士がそのまま交代する');
      pointer(w,d,'pointerup');pointer(w,d,'pointerdown');qa.step(1.1);
      check(qa.state.state==='stopped'&&qa.state.change.started,'ボタンを押しても交代中は発車しない');
      const notice=d.querySelector('#driverNotice'),rect=notice.getBoundingClientRect();
      check(!notice.hidden&&rect.left>=0&&rect.right<=width,'交代の挨拶が画面内に収まる');
      check(notice.textContent.includes('こうたいします')&&!notice.textContent.includes('おねがいします'),'挨拶をご指定の「交代します」に変更した');
      check(qa.state.change.old.driver&&qa.state.change.next.driver,'2人の制服の運転士を表示する');
      if(params.get('preview')==='driver'){result.textContent='保谷駅の運転士交代（確認用・本番の保存データとは別）';return;}
      qa.step(5);check(qa.state.change===null&&qa.state.state!=='stopped','交代後は長押しのまま発車できる');
      check(qa.state.clipCalls.filter(n=>n==='handover').length===1,'男性の交代挨拶は1回だけ');
      pointer(w,d,'pointerup');
      check(errors.length===0,'交代から発車まで実行時エラーなし');
      qa.hoya();check(qa.state.waiting===null&&qa.state.change===null,'旅程を選び直すと待機と交代を片づける');
      localStorage.removeItem(key);
    }
    check(localStorage.getItem('seibu')===realSave,'既存の保存データを変更しない');
    result.textContent+='\n'+count+' checks passed';
  }catch(e){result.textContent+='\nFAIL '+e.stack;result.style.color='#b31828';}
  finally{if(key)localStorage.removeItem(key);document.querySelector('#run').disabled=false;}
};
if(params.has('preview'))document.querySelector('#run').click();
</script>
