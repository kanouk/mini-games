<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>せいぶせん うんてんし</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* 1画面ゲーム：上＝景色（キャンバス）＋車内表示器、下＝大きな操作ボタン。世界観に合わせた単一テーマ */
:root{
  --sky:#8fd0ff;
  --night:#14213d;
  --panel:#ffffff;
  --ink:#14213d;
  --go:#ffcf33;
  --go-ink:#3a2a00;
  --horn:#ff8a3d;
  --chip:#24365e;
  --chip-on:#3d8bff;
  --rail:#c3ccd9;
  --led-bg:#121212;
  --led:#ffb21e;
  --led-dim:#5a3c06;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --dot:"DotGothic16","MS Gothic","Osaka-Mono",monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--panel);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.app{position:relative;height:100%;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0;background:var(--sky);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}

.hud{position:absolute;top:10px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;gap:12px;align-items:flex-start;pointer-events:none}
.fs-ipad .hudMain>.row:first-child{padding-left:65px}
.hudMain{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.pill{background:var(--panel);color:var(--ink);border-radius:18px;padding:6px 14px;box-shadow:0 2px 0 rgba(20,33,61,.18)}
.speed{display:flex;align-items:baseline;gap:6px}
.speed b{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right;line-height:1.1}
.speed small{font-size:14px;font-weight:500}
.speed .max{font-size:12px;color:#4b5873;margin-left:4px}
.lineinfo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;min-width:0}
.lineinfo i{width:14px;height:14px;border-radius:50%;background:var(--lc,#3d8bff);flex:none}
.lineinfo small{font-weight:500;font-size:14px}
.led{background:var(--led-bg);border:3px solid #3a3a3a;border-radius:10px;height:46px;overflow:hidden;position:relative;
  font-family:var(--dot);color:var(--led);font-size:26px;line-height:40px;white-space:nowrap;
  background-image:radial-gradient(var(--led-dim) 0.8px,transparent 1px);background-size:4px 4px}
.led span{display:inline-block;padding-left:100%;animation:ledscroll var(--dur,12s) linear infinite;text-shadow:0 0 6px rgba(255,178,30,.55)}
@keyframes ledscroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.route{position:absolute;bottom:6px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;pointer-events:none;padding-block:4px}
.route .line{position:relative;flex:1;height:8px;border-radius:4px;background:var(--rail);min-width:0;margin:0 29px}
.route .tmark{position:absolute;top:50%;width:58px;height:24px;margin:-13px 0 0 -29px;left:0;overflow:visible}
.tmark .b{fill:var(--low,#f7f9fb);stroke:#5b6676;stroke-width:.8}
.tmark .u{fill:var(--up,#f7f9fb)}.tmark .l{fill:var(--line,#d6283c)}.tmark .w{fill:#2c3a4f}
.map{align-self:flex-end;flex:none;width:min(34vw,220px,34vh);
  background:var(--panel);border-radius:16px;padding:6px;box-shadow:0 3px 0 rgba(20,33,61,.18);pointer-events:none}
.map canvas{display:block;width:100%;aspect-ratio:1;max-width:100%;border-radius:10px}
.map small{display:block;color:#4b5873;font-size:10px;text-align:center;margin-top:2px}
.banner{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:56px;pointer-events:none;
  background:rgba(20,33,61,.92);color:#fff;border-radius:16px;padding:8px 18px 10px;box-shadow:0 4px 12px rgba(0,0,0,.25);
  display:flex;flex-direction:column;gap:1px;border-left:6px solid var(--lc,#ffcf33)}
.banner[hidden]{display:none}
.banner small{font-size:13px;font-weight:800;letter-spacing:.12em;color:#c9d3e6}
.banner b{font-size:clamp(28px,6vw,40px);font-weight:800;line-height:1.1;color:#ffe08a;font-variant-numeric:tabular-nums}
.banner span{white-space:nowrap;font-size:clamp(14px,3.6vw,17px);font-weight:800}
.driverNotice{position:absolute;left:16px;bottom:56px;max-width:calc(100% - 32px);box-sizing:border-box;padding:12px 18px;border-radius:16px;background:#14213df2;color:white;pointer-events:none;box-shadow:0 4px 12px #0004}
.driverNotice b{display:block;color:#ffe08a;font-size:18px;margin-bottom:4px}
.driverNotice span{font-size:15px;line-height:1.6}
.driverNotice[hidden],.stage:has(.driverNotice:not([hidden])) .banner{display:none}
.app:has(.sheet:not([hidden])) .driverNotice{display:none}

.bar{display:flex;flex-wrap:wrap;gap:12px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:var(--font);border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.go,.horn,canvas{touch-action:none}
button:focus-visible{outline:4px solid var(--panel);outline-offset:3px}
/* うんてんの ボタン：act（きほん）＋ main（おおきい 3つ）／ sub（ちいさい 2つ）。いろは --bg と --sh で きりかえる */
.act{min-height:92px;border-radius:24px;background:var(--bg);color:#fff;font-weight:800;box-shadow:0 6px 0 var(--sh);white-space:nowrap}
.act:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh)}
.act.main{flex:1 1 0;min-width:120px;padding:0 8px;font-size:clamp(16px,2.1vw,26px)}
.act.sub{flex:0 0 auto;min-width:92px;padding:0 14px;font-size:clamp(15px,1.8vw,19px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.act.sub svg{width:34px;height:34px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.go{--bg:var(--go);--sh:#c99a00;color:var(--go-ink)}
.go.held{transform:translateY(4px);box-shadow:0 2px 0 var(--sh)}
.go.wait{--bg:#e6e9ef;--sh:#a9b0bd;color:#5b6475}
.annbtn{--bg:#2aa59a;--sh:#1b7a71}
.crewbtn{--bg:#5b5fc7;--sh:#3e419a}
.horn{--bg:var(--horn);--sh:#c45e1d}
.ebtn{--bg:#d62839;--sh:#9c1626}
.ebtn:disabled{--bg:#4a2a35;--sh:#2e1a20;color:#a88c94;cursor:default;transform:none}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow-y:auto;z-index:5;background:rgba(20,33,61,.97);
  border-radius:22px 22px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.3);
  padding-block:14px max(14px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app:has(.sheet:not([hidden])) .banner{display:none}
.sheet h2{margin:0 0 10px;font-size:22px;font-weight:800;text-align:center}
.sheet .close{margin-top:12px;min-height:54px}
.ann.em{border-left-color:#d62839;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px}
.ann.em .eic{width:44px;height:44px;flex:none;padding:8px;border-radius:50%;background:#fde4e6;color:#d62839;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;box-sizing:border-box}
.ann.em .etx{display:flex;flex-direction:column;gap:2px;min-width:0}
.ann.em small{white-space:nowrap;font-size:12px;line-height:1.5}
.ann.crew{border-left-color:#5b5fc7}
.anngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;max-width:820px;margin:0 auto}
.ann{min-height:84px;border-radius:18px;background:var(--panel);color:var(--ink);font-size:20px;font-weight:800;padding:8px 14px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;border-left:10px solid #2aa59a}
.ann small{font-size:13px;font-weight:500;color:#4b5873}
.ann.playing{background:#dff5f2}
.opts{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;align-content:center}
.opt{width:66px;height:66px;padding:4px 2px;border-radius:16px;background:var(--chip);color:#fff;font-weight:800;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.opt svg{width:28px;height:28px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.opt span{font-size:11px;line-height:1.1;white-space:nowrap}
.opt[aria-pressed="true"]{background:var(--chip-on)}
.painter .box{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.preview{background:var(--sky);border-radius:16px;overflow:hidden}
.preview canvas{display:block;width:100%;height:auto;aspect-ratio:420/90;max-width:100%}
.part h3{margin:0 0 6px;font-size:18px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:var(--c);position:relative}
.sw[aria-pressed="true"]{border:4px solid var(--go);box-shadow:0 0 0 3px var(--night) inset}
.reset{min-height:60px;min-width:160px;border-radius:18px;background:var(--chip);color:#fff;font-size:20px;font-weight:800}

.trip{padding-block:0 !important;overflow:hidden !important}
.tripbox{max-width:980px;margin:0 auto;height:100%;min-height:0;display:flex;flex-direction:column}
.triphead{display:flex;align-items:center;gap:10px;padding:16px 4px 12px;flex:none}
.triphead i{width:16px;height:16px;border-radius:50%;background:var(--lc)}
.triphead h2{margin:0;font-size:24px;text-align:left}
.tripgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;align-content:start;
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:4px}
@media (max-width:720px){.tripgrid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);color:var(--ink);border-radius:18px;padding:14px}
.card h3{margin:0 0 10px;font-size:15px;font-weight:800;color:#4b5873}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;background:#eef2f8;padding:4px;border-radius:14px}
.kinds button{min-height:46px;border-radius:11px;background:transparent;color:#4b5873;font-size:15px;font-weight:800;padding:0 6px}
.kinds button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,33,61,.18)}
.strow.pass .dot{width:10px;height:10px;margin:-5px 0 0 -5px;border-width:2px}
.strow.pass .nm b{font-size:15px;font-weight:500}
.strow .ps{margin-left:auto;font-size:11px;color:#8a94a6}
.ends{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:stretch}
.endcard{background:#eef2f8;color:var(--ink);border-radius:14px;padding:8px 10px;text-align:left;border:3px solid transparent;display:flex;flex-direction:column;gap:1px;min-width:0}
.endcard small{font-size:12px;font-weight:800;color:#4b5873}
.endcard b{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.endcard span{font-size:12px;color:#4b5873;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.endcard[aria-pressed="true"]{border-color:var(--lc);background:#fff}
.swap{width:46px;border-radius:14px;background:#eef2f8;color:var(--ink);display:grid;place-items:center}
.swap svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hint{margin:10px 2px 6px;font-size:13px;font-weight:800;color:#4b5873}
.stlist{list-style:none;margin:0;padding:0;max-height:min(52vh,560px);overflow-y:auto;border-radius:12px;background:#f6f8fb}
.strow{position:relative;width:100%;display:flex;align-items:center;gap:12px;padding:7px 12px 7px 44px;background:none;color:var(--ink);text-align:left;min-height:46px}
.strow::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:5px;margin-left:-2.5px;background:#cfd6e0}
li:first-child>.strow::before{top:50%}li:last-child>.strow::before{bottom:50%}
.strow.in::before{background:var(--lc)}
.strow .dot{position:absolute;left:22px;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:3px solid #b3bdcb;box-sizing:border-box}
.strow.in .dot{border-color:var(--lc)}
.strow.end .dot{width:22px;height:22px;margin:-11px 0 0 -11px;background:var(--lc);border-color:#fff;box-shadow:0 0 0 2px var(--lc)}
.strow .nm{display:flex;flex-direction:column;min-width:0}
.strow .nm b{font-size:18px;font-weight:800}
.strow .nm small{font-size:11px;color:#4b5873}
.strow:not(.in) .nm{opacity:.55}
.strow .tag{margin-left:auto;font-size:12px;font-weight:800;color:#fff;background:var(--lc);border-radius:999px;padding:3px 10px}
.strow:hover{background:#eaf0f8}
.timecard{container-type:inline-size;min-width:0}
.timecard .trow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) auto repeat(2,minmax(0,1fr));gap:6px;align-items:center}
@media (max-width:460px){.timecard .trow{grid-template-columns:repeat(4,minmax(0,1fr))}.timecard .tbig{grid-column:1/-1;order:-1;justify-self:center}}
@container (max-width:480px){.timecard .trow{grid-template-columns:repeat(4,minmax(0,1fr))}.timecard .tbig{grid-column:1/-1;order:-1;justify-self:center}}
@container (max-width:300px){.timecard .trow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tstep{min-height:54px;min-width:0;padding:0 2px;white-space:nowrap;border-radius:14px;background:#e3e9f3;color:var(--ink);font-size:15px;font-weight:800;touch-action:manipulation}
.tstep:active{transform:translateY(2px)}
.tstep:disabled{opacity:.35;cursor:default}
.tbig{text-align:center;font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;padding:0 8px;line-height:1.1}
.ttquick{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ttquick button{min-height:40px;padding:0 12px;white-space:nowrap;border-radius:999px;background:#eef2f8;color:var(--ink);font-size:14px;font-weight:800;touch-action:manipulation}
.ttrange{margin:8px 0 0;font-size:13px;color:#4b5873}
.sumcard{margin-top:16px}
.sumline{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.sumline .pt b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.sumline .pt span{font-size:15px;font-weight:800}
.sumline .pt:last-child{text-align:right}
.sumline .ar{height:6px;border-radius:3px;background:var(--lc);position:relative}
.sumline .ar::after{content:"";position:absolute;right:-2px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:12px solid var(--lc);border-right:0}
.summeta{margin:10px 0 0;font-size:14px;color:#4b5873;text-align:center}
/* ぜんがめんの パネル：したに とじる・きめる ボタンを いつも だす */
.pbar{position:sticky;bottom:0;z-index:2;display:flex;gap:10px;justify-content:flex-end;max-width:980px;margin:16px auto 0;padding:14px 0 max(14px,env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(20,33,61,0),rgba(20,33,61,.97) 30%)}
.pbar .close{margin:0;min-width:0;flex:0 1 320px;white-space:nowrap;padding:0 18px;font-size:clamp(17px,4.6vw,22px)}
.pbar .reset{flex:none;min-width:96px;padding:0 16px;font-size:clamp(17px,4.6vw,20px)}
.trip .pbar{position:static;flex:none;align-self:stretch;max-width:none;margin:0;padding:14px 4px max(14px,env(safe-area-inset-bottom,0px));
  background:var(--night);border-top:1px solid #354461}
.trip .pbar .close{flex:1;max-width:320px;padding:0 12px;font-size:clamp(14px,3.7vw,22px)}
.trip .pbar .reset{min-width:76px;padding:0 12px;font-size:clamp(16px,3.7vw,20px)}
.tripsum{text-align:center;margin:6px 0 12px;font-size:20px;font-weight:800;color:#fff}
.picker,.painter{position:absolute;inset:0;background:var(--night);overflow-y:auto;z-index:5;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.clock{display:flex;align-items:baseline;gap:6px}
.clock b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.clock small{font-size:13px;font-weight:500}
.ttwrap{max-width:560px;margin:14px auto 0;overflow-x:auto;border-radius:12px}
.ttable{width:100%;border-collapse:collapse;background:var(--panel);color:var(--ink);font-variant-numeric:tabular-nums}
.ttable th{background:#e6ebf3;font-size:15px;padding:8px 12px;text-align:left}
.ttable td{font-size:19px;font-weight:800;padding:7px 12px;border-top:1px solid #e3e8f0}
.ttable td small{display:block;font-size:11px;font-weight:500;color:#4b5873}
.ttable td small.late{color:#d62839;font-weight:800}
.ttable tr.now td{background:#fff1bf}
.ttable tr.pass td{color:#8a94a6;font-weight:500}
.ttable .t{text-align:right;width:5.5em}
.picker h2,.painter h2{margin:0 0 14px;font-size:clamp(19px,5.4vw,26px);font-weight:800;text-align:center;white-space:nowrap}
.grid{padding-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;max-width:980px;margin:0 auto}
.lineBtn{min-height:84px;border-radius:18px;background:var(--panel);color:var(--ink);text-align:left;padding:10px 14px 10px 22px;
  position:relative;display:flex;flex-direction:column;justify-content:center;gap:2px}
.lineBtn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;border-radius:18px 0 0 18px;background:var(--lc)}
.lineBtn b{font-size:22px;font-weight:800;white-space:nowrap}
.lineBtn.thru b{font-size:clamp(17px,1.9vw,20px)}
.gridhead{grid-column:1/-1;margin:10px 0 -2px;font-size:17px;font-weight:800;color:#ffe08a}
.lineBtn small{font-size:13px;font-weight:500;color:#4b5873}
.lineBtn[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--lc)}
.lineBtn[aria-pressed="true"]::after{content:"のっている";position:absolute;top:-10px;right:12px;box-shadow:0 2px 0 rgba(0,0,0,.15);font-size:12px;font-weight:800;color:#fff;background:var(--lc);border-radius:999px;padding:2px 9px}
.close{display:block;margin:18px auto 0;min-height:60px;min-width:200px;border-radius:18px;background:var(--go);color:var(--go-ink);font-size:22px;font-weight:800}
@media (prefers-reduced-motion:reduce){
  .led span{animation:none;padding-left:8px;white-space:normal;font-size:20px;line-height:1.2}
  .led{height:auto;min-height:46px;white-space:normal}
}
@media (max-width:520px){.act.main{flex-basis:28%;min-width:0;font-size:15px;padding:0 4px}.act.sub{flex:1 1 40%;min-height:64px;flex-direction:row}}
/* スマホ：うえの ひょうじを ちいさく。じこくと はやさを 1ぎょうに、ちずは ちいさく して おすと おおきく なる */
@media (max-width:640px){
  .hud{gap:8px}
  .hudMain{gap:6px}
  .hudMain>.row:first-child{flex-wrap:wrap;gap:6px;justify-content:flex-start}
  .pill{padding:4px 9px;border-radius:14px}
  .clock,.speed{gap:3px}
  .clock b{font-size:20px}.clock small{font-size:11px}
  .speed b{font-size:22px;min-width:1.6em}.speed small{font-size:11px}.speed .max{font-size:10px;margin-left:2px}

/* ---------- ろせん（ROUTES）：BASE の えきを つなげて、のりかえ なしで はしる くかんを つくる ---------- */
/* route(id, なまえ, よみ, いろ, グループ, [[BASEの id, から, まで], ...]) */
function route(id,name,kana,c,group,parts){
  const st=[],seg=[];
  parts.forEach(([lid,from,to])=>{const L=BASE[lid];if(!L)throw new Error('no line '+lid);
    const i=L.st.findIndex(s=>s[0]===from),j=L.st.findIndex(s=>s[0]===to);if(i<0||j<0)throw new Error('no station '+lid+' '+from+'/'+to);
    const step=i<=j?1:-1;
    for(let x=i;x!==j+step;x+=step){
      if(x===i&&st.length){if(st[st.length-1][0]!==L.st[x][0])throw new Error('gap '+id);continue;}
      if(st.length){const lo=Math.min(x,x-step),si=L.slow?L.st.findIndex(s=>s[0]===L.slow[0]):-1;
        seg.push({l:lid,d:Math.abs(L.st[x][4]-L.st[x-step][4]),v:si>=0&&lo>=si?L.slow[1]:L.sp});}
      st.push(L.st[x]);
    }});
  return {id,name,kana,c,group,st,seg};
}
/* ---------- しゅべつ（TYPES）の きまり ---------- */
function stIndex(R,n){return R.st.findIndex(s=>s[0]===n);}
function typeRange(R,ty){
  if(ty.range){const a=stIndex(R,ty.range[0]),b=stIndex(R,ty.range[1]);return[Math.min(a,b),Math.max(a,b)];}
  if(ty.stops){let lo=1e9,hi=-1;R.st.forEach((s,i)=>{if(ty.stops.includes(s[0])){lo=Math.min(lo,i);hi=Math.max(hi,i);}});return[lo,hi];}
  return[0,R.st.length-1];
}
function stopsAt(R,ty,i){const [lo,hi]=typeRange(R,ty);if(i<lo||i>hi)return false;return !ty.stops||ty.stops.includes(R.st[i][0]);}
/* のぼり（up）＝ えきばんごうが ちいさい ほう（池袋・西武新宿 がわ）へ むかう */
function typeOK(R,ty,a,b){
  if(a===b||!stopsAt(R,ty,a)||!stopsAt(R,ty,b))return false;
  if(ty.dir==='up'&&b>a)return false;if(ty.dir==='down'&&b<a)return false;
  if(ty.only&&!ty.only.some(([x,y])=>R.st[a][0]===x&&R.st[b][0]===y))return false;
  return true;
}
function typesOf(R){return TYPES[R.id]||[];}
function restoreSayamaSelection(data){
  if(data.lineId!=='sayama')return data;
  const through=ROUTES.find(r=>r.id==='sayama-through');
  const branchStart=stIndex(through,'西所沢');
  const inBranch=index=>Number.isInteger(index)&&index>=branchStart&&index<through.st.length;
  if(data.ti===0&&inBranch(data.tripA)&&inBranch(data.tripB)){
    return {...data,lineId:'sayama-local',tripA:data.tripA-branchStart,tripB:data.tripB-branchStart};
  }
  // 旧順は狭山線内の各停、急行、特急、直通各停、準急。
  const throughType=[undefined,2,3,0,1][data.ti];

function serOf(id){return SERIES[id]||SERIES[Object.keys(SERIES)[0]];}

/* ---------- のる でんしゃ（Trip） ----------

   じこく（めやす）＝ えきかんの キロ ÷（さいこうそくどの 72%）＋ とまる えきの かそく・げんそく 0.6ぷんずつ ＋ ていしゃ。
   がめんの えきの あいだの ながさも キロに あわせて かわる（ちかい えきは みじかく、とおい えきは ながく） */

    let r=T.findIndex(t=>t===T[ti]&&typeOK(R,t,b,a));if(r<0)r=T.findIndex(t=>t.k===T[ti].k&&typeOK(R,t,b,a));if(r<0)r=T.findIndex(t=>typeOK(R,t,b,a));this.ri=r<0?ti:r;

  legTimes(L){const p=L%2;if(this._lt[p])return this._lt[p];const n1=this.len,k0=p*n1,a=[0],d=[0],dw=this.legType(L).dwell||DWELL;let t=0;

function elevationRaw(t,x){const k=t.kAt(x),P=t._heights.length,i=((k%P)+P)%P;
  return elevationLevel(t._heights[i],(x-t.X(k))/(t.X(k+1)-t.X(k)));}
function elevationAt(t,x){
  /* 高架と地上でホームの高さが違う折返しも、近くの勾配でなめらかにつなぐ。 */
  const k=t.kAt(x),turn=Math.round(k/t.len)*t.len;
  for(const j of [turn,turn+t.len]){const edge=t.X(j);if(Math.abs(x-edge)>500)continue;
    const a=elevationRaw(t,edge-.01),b=elevationRaw(t,edge+.01);if(Math.abs(a-b)<.01)continue;
    const f=Math.max(0,Math.min(1,(x-edge+500)/1000)),p=f*f*(3-2*f);return a+(b-a)*p;}
  return elevationRaw(t,x);

function undergroundDepth(t,x){
  const k=t.kAt(x),start=UG[t.st(k)[0]],end=UG[t.st(k+1)[0]];
  if(!start&&!end)return 0;
  if(start&&end)return 1;
  const fraction=(x-t.X(k))/(t.X(k+1)-t.X(k));
  const towardSurface=start?fraction:1-fraction;
  const depth=Math.max(0,Math.min(1,(UG_PORTAL-towardSurface)/.28));

const featCache=new Map();

const clipBuffers={};let clipsReady=null;
function prepareClips(){
  if(clipsReady)return clipsReady;
  const context=AC;
  clipsReady=Promise.all(Object.entries(CLIP_DATA).map(async([name,data])=>{
    try{const bytes=Uint8Array.from(atob(data),c=>c.charCodeAt(0));clipBuffers[name]=await context.decodeAudioData(bytes.buffer);}catch(e){}
  }));return clipsReady;
}
function playClip(name){
  if(!soundOn||!AC||!clipBuffers[name])return false;
  const src=AC.createBufferSource();src.buffer=clipBuffers[name];src.connect(master);src.onended=()=>src.disconnect();src.start();return true;
}
function ensureAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=soundOn?0.8:0;master.connect(AC.destination);
    prepareClips();
    motorOsc=AC.createOscillator();motorOsc.type='sawtooth';motorOsc.frequency.value=100;
    motorFilt=AC.createBiquadFilter();motorFilt.type='lowpass';motorFilt.frequency.value=400;
    motorGain=AC.createGain();motorGain.gain.value=0;
    motorOsc.connect(motorFilt);motorFilt.connect(motorGain);motorGain.connect(master);motorOsc.start();
  }catch(e){AC=null;}
}
function noise(){if(noiseBuf)return noiseBuf;const n=Math.floor(AC.sampleRate*0.8);noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return noiseBuf;}
function burst(t,f,g,dur,type){const src=AC.createBufferSource();src.buffer=noise();const fl=AC.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.value=f;fl.Q.value=1.1;const gn=AC.createGain();gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(0.001,t+dur);src.connect(fl);fl.connect(gn);gn.connect(master);src.start(t);src.stop(t+dur+0.05);}
function tone(f,t,dur,type,g){const o=AC.createOscillator();o.type=type||'sine';o.frequency.value=f;const gn=AC.createGain();gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(g||0.25,t+0.02);gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+dur+0.05);}
function clack(){if(!AC)return;const t=AC.currentTime;burst(t,170,0.5,0.08);burst(t+0.11,150,0.4,0.08);}
function carChime(){if(!AC)return;const t=AC.currentTime;[784,988,1175].forEach((f,i)=>tone(f,t+i*0.2,0.6,'sine',0.16));}
function pinpon(){if(!AC)return;const t=AC.currentTime;tone(988,t,0.8);tone(784,t+0.4,1.1);}
function bell(){if(!AC)return;const t=AC.currentTime;[523,659,784,1047,784,880,1047].forEach((f,i)=>tone(f,t+i*0.2,0.35,'triangle',0.18));}
function doorSnd(){if(!AC)return;burst(AC.currentTime,900,0.3,0.6,'lowpass');}
function hornSnd(){if(!AC)return;const t=AC.currentTime;[440,554].forEach(f=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1600;const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.13,t+0.05);g.gain.setValueAtTime(0.13,t+0.8);g.gain.exponentialRampToValueAtTime(0.0001,t+1.1);o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+1.2);});}

const ODD_VOICE=/^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Kathy|Ralph|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley)\b/i;
const GOOD_JA=['Kyoko','O-ren','Otoya','Hattori','Google 日本語','Microsoft Nanami','Microsoft Ayumi','Microsoft Haruka'];
const GOOD_EN=['Samantha','Ava','Allison','Alex','Susan','Zoe','Evan','Nathan','Tom','Google US English','Microsoft Aria','Microsoft Jenny','Microsoft Guy','Microsoft Zira'];
function bestVoice(vs,lang,good){
  const score=x=>{if(ODD_VOICE.test(x.name))return -1;const i=good.findIndex(g=>x.name.startsWith(g));
    return (i<0?0:100-i)+(lang.test(x.lang)?10:0)+(/Enhanced|Premium|拡張|プレミアム/.test(x.name)?5:0)+(x.localService?1:0);};

function crossDist(){const k=kAt(pos);let m=1e9;for(let j=k-1;j<=k+1;j++)feat(j).cr.forEach(x=>{m=Math.min(m,Math.abs(x-(pos+FRONT)),Math.abs(x-pos));});return m;}
let kanT=0;
function update(dt){
  const prevJoint=Math.floor(pos/JOINT),prevK=kAt(pos);
  if(state==='stopped'){
    stopT+=dt;
    if(stopT>0.6&&doorAnim<1){if(doorAnim===0)doorSnd();doorAnim=Math.min(1,doorAnim+dt*1.5);}
    if(auto&&stopT>6)depart();
    else if(holding()&&stopT>3.5&&!paxBusy())depart();/* ながおし したままなら、のりおりが おわったら つぎの えきへ */
  }else if(state==='bell'){
    bellT+=dt;if(bellT>1.5&&!paxBusy()){state='closing';doorSnd();}
  }else if(state==='closing'){
    doorAnim-=dt*1.2;
    if(doorAnim<=0){doorAnim=0;startRunning();}
  }else if(state==='running'){
    if(holding()||auto)v+=ACC*dt;else v-=COAST*dt;
    {const vm=segVmax(curK());if(v>vm)v=Math.max(vm,v-BRAKE*dt);v=Math.max(0,v);}
    const rem=X(target)-pos;
    if(!announced&&rem<4200&&(!speechBusy()||rem<2600)){announced=true;approach();}
    if(rem<=v*v/(2*BRAKE)+2)state='braking';
    else pos+=v*dt;
  }
  if(state==='estop'){
    v-=420*dt;const rem=X(target)-pos;
    if(v<=0){v=0;emergencyStopped();}
    else{const step=v*dt;if(step>=rem){if(est.delayMinutes){pos=X(target)-0.5;v=0;emergencyStopped();}else{stopSqueal();delay+=2;arrive();}}else pos+=step;}
  }else if(state==='estopWait'){
    estT+=dt;if(estT>=estWait&&(!speechBusy()||estT>=estWait+9))emergencyResume();
  }
  if(state==='braking'){
    const rem=X(target)-pos;
    if(!announced){announced=true;approach();}
    if(rem<=0.5){arrive();}
    else{
      v-=(v*v/(2*rem))*dt;if(v<25)v=25;
      const step=v*dt;
      if(step>=rem)arrive();else pos+=step;
    }
  }
  {const nk=kAt(pos);for(let k=prevK+1;k<=nk;k++)stationReached(k);}
  paxUpdate(dt);
  updateDriverChange(dt);
  if(v>40&&Math.floor(pos/JOINT)!==prevJoint)clack();
  if(hornT>0)hornT-=dt;
  if(crewT>0)crewT-=dt;
  kanT-=dt;{const cd=crossDist();if(cd<1600&&kanT<=0){kan(1-cd/1600);kanT=0.42;}}
  if(AC&&motorGain){
    const r=v/MAXV,t=AC.currentTime,S=SER();
    motorOsc.frequency.setTargetAtTime((S.motor||110)+r*650,t,0.1);
    motorFilt.frequency.setTargetAtTime(300+r*1600,t,0.1);
    motorGain.gain.setTargetAtTime(v>1?0.025+0.035*r:0,t,0.15);
  }
}

function mix(a,b,f){const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*f).toString(16).padStart(2,'0')).join('');}

  if(idx(k-1)===idx(k+1)){/* しゅうてん・しはつえき：となりの えきは 1つだけ。でんしゃは みぎに すすむ */ctx.textAlign='right';ctx.fillText(q[0]+'  '+q[1]+' →',c+sx,ny,W-28);}
  else{ctx.textAlign='left';ctx.fillText('← '+p[0],c-sx,ny,W/2-20);ctx.textAlign='right';ctx.fillText(q[0]+' →',c+sx,ny,W/2-20);}
}
function numColor(num){const m=num&&num.match(/^[A-Z]+/);return (m&&NUMC[m[0]])||'#1f5fbf';}

/* ふみきり（おく がわ）：みちと けいほうき。でんしゃが ちかいと ランプが こうごに ひかる */
function drawCrossingBack(x,near,t){
  ctx.fillStyle='#7d8590';ctx.beginPath();ctx.moveTo(x-34,ty+2);ctx.lineTo(x-14,ty-40);ctx.lineTo(x+14,ty-40);ctx.lineTo(x+34,ty+2);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f1f1f1';ctx.fillRect(x-1,ty-38,2,38);
  const px=x+22;ctx.fillStyle='#3a3f47';ctx.fillRect(px-1.5,ty-78,3,76);
  ctx.save();ctx.translate(px,ty-74);ctx.fillStyle='#ffd400';ctx.strokeStyle='#14213d';ctx.lineWidth=0.8;
  [Math.PI/4,-Math.PI/4].forEach(a=>{ctx.save();ctx.rotate(a);ctx.fillRect(-12,-2.2,24,4.4);ctx.fillStyle='#14213d';for(let i=-10;i<12;i+=6)ctx.fillRect(i,-2.2,3,4.4);ctx.fillStyle='#ffd400';ctx.restore();});ctx.restore();
  const on=near&&!reduced?Math.floor(t*2.4)%2:-1;
  [-6,6].forEach((o,i)=>{ctx.fillStyle='#22262c';ctx.beginPath();ctx.arc(px+o,ty-60,4.2,0,7);ctx.fill();ctx.fillStyle=(near&&(reduced||on===i))?'#ff2a2a':'#5a1d1d';ctx.beginPath();ctx.arc(px+o,ty-60,3,0,7);ctx.fill();});
  /* しゃだんき（さがって いる ときは よこ、あがって いる ときは たて） */
  ctx.strokeStyle='#ffd400';ctx.lineWidth=2.4;ctx.beginPath();
  if(near){ctx.moveTo(px,ty-30);ctx.lineTo(px-44,ty-30);}else{ctx.moveTo(px,ty-30);ctx.lineTo(px+4,ty-74);}ctx.stroke();

const RISE=54,DEPTH=198,UG_CEILING=180;
let groundY=0;
function railY(worldX){return groundY-RISE*elevationAt(trip,worldX)+DEPTH*undergroundDepth(trip,worldX);}
function drawViaduct(camX,t){
  const ground=groundY,points=[];
  for(let x=0;x<bw+12;x+=12){const h=elevationAt(trip,camX+x);points.push({x,h,y:railY(camX+x),g:ground+14+44*h});}
  /* 連続した輪郭を一度で塗り、細い白い継ぎ目を作らない。 */
  ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y+16):ctx.moveTo(p.x,p.y+16));
  for(let i=points.length-1;i>=0;i--){const p=points[i];ctx.lineTo(p.x,Math.max(p.y+16,p.g));}ctx.closePath();
  ctx.fillStyle=tint('#dce5e4');ctx.fill();ctx.save();ctx.clip();
  ctx.fillStyle=tint('#737e89');ctx.fillRect(0,ground+30,bw,22);ctx.fillStyle='#e9e9d8';
  for(let j=Math.floor(camX/50)-1;j<=Math.floor((camX+bw)/50)+1;j++)ctx.fillRect(j*50-camX,ground+40,26,1.5);
  ctx.restore();
  /* 画面内に見えている高架だけに、桁・橋脚・橋脚の影を描く。 */
  for(let j=Math.floor(camX/150)-1;j<=Math.floor((camX+bw)/150)+1;j++){
    const wx=j*150,h=elevationAt(trip,wx);if(h<.15)continue;const x=wx-camX,top=railY(wx)+16,bottom=ground+14+44*h;
    ctx.fillStyle='rgba(20,33,61,.16)';ctx.beginPath();ctx.ellipse(x+4,bottom+1,23,4,0,0,7);ctx.fill();
    ctx.fillStyle=tint('#b8c2cc');ctx.fillRect(x-8,top,16,bottom-top);ctx.fillStyle=tint('#939fac');ctx.fillRect(x+3,top,5,bottom-top);
    ctx.fillStyle=tint('#cbd2d9');rr(x-17,top-3,34,8,2);ctx.fill();ctx.fillRect(x-13,bottom-5,26,5);
  }
  ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y+6):ctx.moveTo(p.x,p.y+6));
  for(let i=points.length-1;i>=0;i--){const p=points[i];ctx.lineTo(p.x,p.y+6+13*p.h);}ctx.closePath();ctx.fillStyle=tint('#9aa7b5');ctx.fill();
  ctx.fillStyle='#6b4a32';
  for(let j=Math.floor(camX/24)-1;j<=Math.floor((camX+bw)/24)+1;j++)ctx.fillRect(j*24-camX,railY(j*24)+2,9,5);
  ctx.strokeStyle='#7b8494';ctx.lineWidth=3;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();
}

function drawUnderground(camX,k0,k1){
  for(let k=k0;k<=k1;k++){
    const f=feat(k);
    if(!f.ug||f.t1<camX-16||f.t0>camX+bw+16)continue;
    // 区間の重なりを駅の中心で切り、地下壁の継ぎ目を作らない。
    const start=Math.max(f.t0,X(k),camX-16),end=Math.min(f.t1,X(k+1),camX+bw+16);
    if(end<=start)continue;
    const points=[];
    for(let x=start;x<end;x+=12)points.push([x-camX,railY(x)]);
    points.push([end-camX,railY(end)]);
    const fillBand=(top,bottom,color)=>{
      ctx.beginPath();
      points.forEach(([x,y],i)=>i?ctx.lineTo(x,top(y)):ctx.moveTo(x,top(y)));
      for(let i=points.length-1;i>=0;i--){const [x,y]=points[i];ctx.lineTo(x,bottom(y));}
      ctx.closePath();ctx.fillStyle=color;ctx.fill();
    };
    const ceiling=y=>y-UG_CEILING;
    fillBand(y=>Math.min(groundY,ceiling(y)-6),y=>y+20,'#75685c');
    fillBand(ceiling,y=>y+16,'#293340');
    fillBand(ceiling,y=>ceiling(y)+8,'#65717d');
    fillBand(y=>y-45,y=>y+14,'#394551');
    for(let x=Math.ceil(start/120)*120;x<end;x+=120){
      const y=railY(x);
      ctx.fillStyle='#44515e';ctx.fillRect(x-camX,ceiling(y)+9,4,UG_CEILING+4);
      ctx.fillStyle='#ffe7a8';ctx.fillRect(x-camX-10,ceiling(y)+15,24,4);
    }
    for(const portal of [f.t0,f.t1]){
      if(portal<X(k)||portal>X(k+1)||portal<camX-16||portal>camX+bw+16)continue;
      ctx.fillStyle='#a4aeb9';ctx.fillRect(portal-camX-5,ceiling(railY(portal))-5,10,UG_CEILING+15);
    }
  }
}

function drawWorld(camX,t){
  const k0=kAt(camX)-1,k1=kAt(camX+bw)+1;
  ctx.strokeStyle='#4b5563';ctx.lineWidth=1.4;ctx.beginPath();for(let x=0;x<=bw+24;x+=24){const y=railY(camX+x)-100;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();
  for(let k=k0;k<=k1;k++){
    const f=feat(k),x0=f.t0-camX,x1=f.t1-camX;
    if(x1<-200||x0>bw+200)continue;
    if(f.ug)continue;
    ctx.fillStyle='#3f8f4e';ctx.beginPath();ctx.moveTo(x0-80,ty+6);
    ctx.bezierCurveTo(x0-20,ty-200,x0+120,ty-250,(x0+x1)/2,ty-250);
    ctx.bezierCurveTo(x1-120,ty-250,x1+20,ty-200,x1+80,ty+6);ctx.closePath();ctx.fill();
    ctx.fillStyle='#2f7a3e';for(let x=x0;x<x1;x+=70){ctx.beginPath();ctx.arc(x+20,ty-200+Math.sin(x)*14,14,0,7);ctx.fill();}
    ctx.fillStyle='#262833';ctx.fillRect(x0,ty-118,x1-x0,124);
    ctx.fillStyle='#ffd166';for(let X0=Math.ceil(f.t0/90)*90;X0<f.t1;X0+=90){ctx.beginPath();ctx.arc(X0-camX,ty-108,3.2,0,7);ctx.fill();}
    ctx.strokeStyle='#6b7280';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x0,ty-100);ctx.lineTo(x1,ty-100);ctx.stroke();
    ctx.fillStyle='#b8bec8';ctx.fillRect(x0-12,ty-128,14,134);ctx.fillRect(x1-2,ty-128,14,134);
  }
  for(let k=k0;k<=k1;k++){const f=feat(k);f.cr.forEach(x=>{const c=x-camX;if(c<-80||c>bw+80)return;drawCrossingBack(c,Math.abs(x-pos)<1600||Math.abs(x-pos-FRONT)<1600,t);});}
  for(let k=k0;k<=k1;k++){
    const c=X(k)-camX;if(c<-420||c>bw+420)continue;
    if(UG[st(k)[0]])continue;
    const baseTy=ty;ty=railY(X(k));
    ctx.fillStyle='#cfd6df';ctx.fillRect(c-310,ty-30,620,24);
    ctx.fillStyle='#9aa6b8';for(let x=-300;x<=300;x+=100)ctx.fillRect(c+x-3,ty-130,6,104);
    ctx.fillStyle='#eef1f5';ctx.fillRect(c-330,ty-142,660,14);ctx.fillStyle='#8996aa';ctx.fillRect(c-330,ty-130,660,3);
    drawSign(c,k);
    ty=baseTy;
  }
  ctx.fillStyle='#8a94a6';
  for(let i=Math.floor(camX/300)-1;i<=Math.floor((camX+bw)/300)+1;i++){
    const X0=i*300+150;if(inTunnel(X0)||nearStation(X0,360))continue;
    const x=X0-camX,y=railY(X0);ctx.fillRect(x-2,y-114,4,118);ctx.fillRect(x-2,y-108,26,3);
  }
  ctx.fillStyle='#b9a27a';ctx.fillRect(0,ty+6,bw,bh-ty);
  ctx.fillStyle='#9c9488';ctx.fillRect(0,ty+2,bw,9);
  for(let k=k0;k<=k1;k++){
    const f=feat(k),x0=f.r0-camX,x1=f.r1-camX;if(x1<-50||x0>bw+50)continue;
    ctx.fillStyle='#4aa3df';ctx.fillRect(x0,ty+12,x1-x0,bh-ty);
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;
    for(let y=ty+26;y<bh;y+=16){ctx.beginPath();for(let x=x0+8;x<x1-20;x+=34){ctx.moveTo(x,y);ctx.quadraticCurveTo(x+7,y-4,x+14,y);}ctx.stroke();}
    ctx.fillStyle='#8792a3';for(let X0=f.r0+40;X0<f.r1;X0+=180)ctx.fillRect(X0-camX-9,ty+12,18,bh-ty);
    ctx.fillStyle='#55606f';ctx.fillRect(x0,ty+2,x1-x0,12);
  }
  drawUnderground(camX,k0,k1);
  drawViaduct(camX,t);
  for(let k=k0;k<=k1;k++){
    const c=X(k)-camX;if(!UG[st(k)[0]]||c<-420||c>bw+420)continue;
    const savedTy=ty;ty=railY(X(k));
    ctx.fillStyle='#566573';ctx.fillRect(c-310,ty-UG_CEILING+8,620,UG_CEILING-16);
    ctx.fillStyle='#8794a0';ctx.fillRect(c-310,ty-55,620,5);
    drawSign(c,k);ty=savedTy;
  }
  /* ふみきりの みち（てまえ） */
  for(let k=k0;k<=k1;k++){feat(k).cr.forEach(x=>{const c=x-camX;if(c<-80||c>bw+80)return;ctx.fillStyle='#7d8590';ctx.beginPath();ctx.moveTo(c-30,ty+2);ctx.lineTo(c+30,ty+2);ctx.lineTo(c+52,bh);ctx.lineTo(c-52,bh);ctx.closePath();ctx.fill();
    ctx.fillStyle='#f1f1f1';ctx.fillRect(c-1,ty+12,2,bh-ty);ctx.fillStyle='#55606f';ctx.fillRect(c-30,ty+1,60,4);});}
}

/* ---------- でんしゃの え（しゃりょう SERIES の かたちと いろ） ---------- */
const FRONT=290;/* せんとうの いち（がめんの まんなかから） */
const NOSE={flat:5,slant:12,egg:24,nra:38,laview:64,agt:10};
const DOORF={4:[.11,.37,.63,.89],3:[.15,.5,.85],2:[.2,.8],1:[.07]};
function carLen(S){return S.len||200;}
function doorXs(S,x0,x1,cab){const span=(cab?x1-NOSE[S.front]-16:x1)-x0;return (DOORF[S.doors]||DOORF[4]).map(f=>x0+span*f);}
function carPath(x0,x1,top,bot,cab,S){
  ctx.beginPath();ctx.moveTo(x0,bot);ctx.lineTo(x0,top+4);ctx.quadraticCurveTo(x0,top,x0+4,top);
  if(!cab){ctx.lineTo(x1-4,top);ctx.quadraticCurveTo(x1,top,x1,top+4);ctx.lineTo(x1,bot);}
  else switch(S.front){
    case 'slant':ctx.lineTo(x1-12,top);ctx.quadraticCurveTo(x1-7,top,x1-5,top+4);ctx.lineTo(x1,top+24);ctx.lineTo(x1,bot);break;
    case 'egg':ctx.lineTo(x1-24,top);ctx.bezierCurveTo(x1-8,top,x1+1,top+12,x1+1,top+30);ctx.lineTo(x1,bot);break;
    case 'nra':ctx.lineTo(x1-38,top);ctx.bezierCurveTo(x1-24,top,x1-6,top+18,x1-1,top+32);ctx.quadraticCurveTo(x1+1,top+38,x1,bot);break;
    case 'laview':ctx.lineTo(x1-64,top);ctx.bezierCurveTo(x1-26,top,x1+2,top+18,x1+2,top+36);ctx.quadraticCurveTo(x1+2,bot,x1-8,bot);break;
    case 'agt':ctx.lineTo(x1-10,top);ctx.quadraticCurveTo(x1,top,x1,top+12);ctx.lineTo(x1,bot);break;
    default:ctx.lineTo(x1-5,top);ctx.quadraticCurveTo(x1-1,top,x1-0.5,top+5);ctx.lineTo(x1,bot);
  }
  ctx.closePath();
}
function cabWindow(x1,top,bot,S){
  ctx.fillStyle='#16202e';ctx.beginPath();
  switch(S.front){
    case 'slant':ctx.moveTo(x1-24,top+9);ctx.lineTo(x1-8,top+9);ctx.lineTo(x1-3,top+24);ctx.lineTo(x1-24,top+24);break;
    case 'egg':ctx.moveTo(x1-30,top+8);ctx.lineTo(x1-14,top+6);ctx.quadraticCurveTo(x1-3,top+12,x1,top+27);ctx.lineTo(x1-30,top+27);break;
    case 'nra':ctx.moveTo(x1-46,top+9);ctx.lineTo(x1-30,top+5);ctx.quadraticCurveTo(x1-16,top+12,x1-8,top+25);ctx.lineTo(x1-46,top+25);break;
    case 'laview':ctx.moveTo(x1-62,top+5);ctx.bezierCurveTo(x1-28,top+3,x1-3,top+17,x1-1,top+34);ctx.quadraticCurveTo(x1-30,top+31,x1-62,top+31);break;
    case 'agt':ctx.rect(x1-18,top+8,17,20);break;
    default:ctx.rect(x1-21,top+10,19,16);
  }
  ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(x1-(S.front==='laview'?50:S.front==='nra'?40:20),top+11,10,1.2);
}
function drawBogie(b,bot,S){
  ctx.fillStyle='#3a4049';rr(b-19,bot-2,38,7,2);ctx.fill();
  const ang=pos/5,agt=S.front==='agt';
  [-10,10].forEach(o=>{const wx=b+o,wy=ty-5;
    ctx.fillStyle='#1c2027';ctx.beginPath();ctx.arc(wx,wy,agt?6:5.2,0,7);ctx.fill();
    ctx.fillStyle=agt?'#c9ced6':'#7d8693';ctx.beginPath();ctx.arc(wx,wy,agt?2.6:1.6,0,7);ctx.fill();
    ctx.strokeStyle='#8a93a0';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(wx,wy);ctx.lineTo(wx+Math.cos(ang)*4.4,wy+Math.sin(ang)*4.4);ctx.stroke();});
}
/* o：{cab:うんてんせきが みぎに あるか, num, lit, tail:うしろの ライト, mir:さゆう はんてん して かいて いるか, led:[しゅべつ, いろ, いきさき]} */
function drawCar(x0,x1,top,bot,o,S){
  const cab=o.cab,nose=cab?NOSE[S.front]:0,H=bot-top;
  drawBogie(x0+30,bot,S);drawBogie(cab?x1-nose-24:x1-30,bot,S);
  carPath(x0,x1,top,bot,cab,S);ctx.fillStyle=S.body;ctx.fill();
  ctx.save();carPath(x0,x1,top,bot,cab,S);ctx.clip();
  (S.stripes||[]).forEach(([a,b,c,pat])=>{if(typeof c==='object'){const g=ctx.createLinearGradient(x0,0,x1,0);c.forEach((cc,i)=>g.addColorStop(i/(c.length-1),cc));ctx.fillStyle=g;}else ctx.fillStyle=c;
    if(pat==='checker'){/* いちまつもよう：まえの ほうほど こく */const h=(b-a)/2;for(let x=x0,j=0;x<x1;x+=h,j++)for(let r=0;r<2;r++){if((j+r)%2)continue;const f=(x-x0)/(x1-x0);if(hash(j*3+r)>0.25+f*0.7)continue;ctx.fillRect(x,top+a+r*h,h,h);}}
    else ctx.fillRect(x0,top+a,x1-x0,b-a);});
  if(cab&&S.face){ctx.fillStyle=S.face;ctx.fillRect(x1-(S.faceW||10),top,(S.faceW||10)+2,H);}
  ctx.fillStyle=shade(top,bot);ctx.fillRect(x0,top-2,x1-x0,H+4);
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(x0,top+2,x1-x0,1);
  if(S.roof){ctx.fillStyle=S.roof;ctx.fillRect(x0,top,x1-x0,2.5);}
  if(cab)cabWindow(x1,top,bot,S);
  ctx.restore();
  carPath(x0,x1,top,bot,cab,S);ctx.strokeStyle='rgba(70,80,95,.55)';ctx.lineWidth=0.8;ctx.stroke();
  /* ドア */
  const dx=doorXs(S,x0,x1,cab),dw=S.doors===1||S.doors===2?10:13,dTop=top+7,dBot=bot-3;
  dx.forEach(d=>{
    ctx.fillStyle=S.door||S.body;ctx.fillRect(d-dw/2,dTop,dw,dBot-dTop);
    ctx.strokeStyle='rgba(60,70,85,.55)';ctx.lineWidth=0.8;ctx.strokeRect(d-dw/2,dTop,dw,dBot-dTop);
    if(dw>11){ctx.beginPath();ctx.moveTo(d,dTop);ctx.lineTo(d,dBot);ctx.stroke();}
    ctx.fillStyle=o.lit?'#fde9a6':'#2b3647';
    if(dw>11){ctx.fillRect(d-5,top+11,3.6,10);ctx.fillRect(d+1.4,top+11,3.6,10);}else ctx.fillRect(d-2.5,top+11,5,10);
    if(doorAnim>0){ctx.fillStyle='#3a4558';ctx.fillRect(d-dw/2*doorAnim,dTop,dw*doorAnim,dBot-dTop);ctx.fillStyle='#e9d9a8';ctx.fillRect(d-dw/2*doorAnim,dTop+2,dw*doorAnim,2);}
  });
  /* まど（ドアと ドアの あいだ） */
  const edges=[x0+4].concat(...dx.map(d=>[d-dw/2-4,d+dw/2+4])).concat([cab?x1-nose-(S.front==='laview'?0:24):x1-4]);
  const wc=o.lit?'#fde9a6':(S.win||'#2c3a4f');let ledDone=!o.led;
  for(let i=0;i<edges.length;i+=2){
    let a=edges[i],b=edges[i+1];if(b-a<8)continue;
    if(!ledDone&&b-a>26){/* よこの ひょうじき（しゅべつと いきさき） */
      const m=(a+b)/2,lw=Math.min(44,b-a-2);ctx.fillStyle='#111';rr(m-lw/2,top+3,lw,7.5,1.2);ctx.fill();
      ctx.save();ctx.translate(m,0);if(o.mir)ctx.scale(-1,1);
      ctx.textBaseline='middle';ctx.font='800 5.6px '+FONT;
      if(lw<27){ctx.textAlign='center';ctx.fillStyle=ledCol(o.led[1]);ctx.fillText(o.led[0],0,top+6.9,lw-3);}
      else{const tw=Math.min(lw*0.42,ctx.measureText(o.led[0]).width);ctx.textAlign='left';ctx.fillStyle=ledCol(o.led[1]);ctx.fillText(o.led[0],-lw/2+1.5,top+6.9,lw*0.42);
        ctx.fillStyle='#ffb21e';ctx.fillText(o.led[2],-lw/2+tw+3,top+6.9,lw-tw-4.5);}
      ctx.restore();ledDone=true;}
    if(S.wins==='big'){/* おおきな まど（Laview） */
      const n=Math.max(1,Math.round((b-a)/26)),w=(b-a)/n;
      for(let j=0;j<n;j++){ctx.fillStyle=o.lit?'#fff1c4':(S.win||'#3b4656');rr(a+j*w+1,top+9,w-2,H-23,3);ctx.fill();
        if(S.seat){ctx.fillStyle=S.seat;rr(a+j*w+w*0.25,top+H-24,w*0.5,9,2.5);ctx.fill();}}
    }else if(S.wins==='express'){
      const n=Math.max(1,Math.round((b-a)/15)),w=(b-a)/n;
      for(let j=0;j<n;j++){ctx.fillStyle=wc;rr(a+j*w+1.5,top+12,w-3,12,1.5);ctx.fill();}
    }else{
      const n=b-a>44?2:1,w=(b-a)/n;
      for(let j=0;j<n;j++){ctx.fillStyle=wc;rr(a+j*w+1,top+12,w-2,13,1.5);ctx.fill();}
    }
  }

  ctx.save();ctx.translate(x0+12,0);if(o.mir)ctx.scale(-1,1);

const mcv=$('mapcv'),mctx=mcv.getContext('2d');let mapOn=true,mapBase=null,mapSize=0,proj=null;
function buildMap(){
  const r=mcv.getBoundingClientRect();if(!r.width)return;
  const d=Math.min(2,window.devicePixelRatio||1);mapSize=r.width;mcv.width=Math.round(r.width*d);mcv.height=Math.round(r.width*d);
  let la0=99,la1=0,lo0=999,lo1=0;line.st.forEach(x=>{la0=Math.min(la0,x[5]);la1=Math.max(la1,x[5]);lo0=Math.min(lo0,x[6]);lo1=Math.max(lo1,x[6]);});
  const k=Math.cos(35.8*Math.PI/180),pad=14,w=Math.max(0.1,(lo1-lo0)*k),h=Math.max(0.1,la1-la0),sc=(mapSize-pad*2)/Math.max(w,h)*0.86;
  const cxm=(lo0+lo1)/2,cym=(la0+la1)/2;lo0=cxm-mapSize/2/sc/k;la1=cym+mapSize/2/sc;
  proj=n=>{const p=POS[n];return p?[(p[1]-lo0)*k*sc,(la1-p[0])*sc]:null;};
  mapBase=document.createElement('canvas');mapBase.width=mcv.width;mapBase.height=mcv.height;
  const g=mapBase.getContext('2d');g.setTransform(d,0,0,d,0,0);
  g.fillStyle='#f4efd9';g.fillRect(0,0,mapSize,mapSize);
  const path=st=>{g.beginPath();st.forEach((s,i)=>{const q=proj(s[0]);if(q){i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]);}});};
  g.lineCap='round';g.lineJoin='round';
  Object.values(BASE).forEach(l=>{path(l.st);g.strokeStyle='#b7c3d3';g.lineWidth=2;g.stroke();});
  path(line.st);g.strokeStyle=line.c;g.lineWidth=4;g.stroke();
  line.st.forEach(s=>{const q=proj(s[0]);if(!q)return;g.fillStyle='#fff';g.strokeStyle=line.c;g.lineWidth=1.5;g.beginPath();g.arc(q[0],q[1],2.4,0,7);g.fill();g.stroke();});
  g.fillStyle='#14213d';g.font='800 10px '+FONT;g.textBaseline='middle';
  [line.st[0],line.st[line.st.length-1]].forEach(s=>{const q=proj(s[0]);if(!q)return;const right=q[0]<mapSize*0.6;g.textAlign=right?'left':'right';g.fillText(s[0],q[0]+(right?6:-6),q[1]);});
}
function drawMap(t){
  if(!mapOn)return;
  if(!mapBase||Math.abs(mcv.getBoundingClientRect().width-mapSize)>1)buildMap();
  if(!mapBase)return;
  const d=mcv.width/mapSize;mctx.setTransform(1,0,0,1,0,0);mctx.drawImage(mapBase,0,0);mctx.setTransform(d,0,0,d,0,0);
  const run=moving(),k=run?curK():kNear(pos),f=run?frac(pos,k):0;
  const a=proj(st(k)[0]),b=proj(st(k+1)[0]);if(!a||!b)return;

  mctx.fillStyle='rgba(230,40,60,.25)';mctx.beginPath();mctx.arc(x,y,7+pr,0,7);mctx.fill();
  mctx.fillStyle='#e6283c';mctx.strokeStyle='#fff';mctx.lineWidth=2;mctx.beginPath();mctx.arc(x,y,5,0,7);mctx.fill();mctx.stroke();
}

function defTrip(l){const d=DEF[l.id];if(!d)return{a:0,b:l.st.length-1,ti:0};return{a:stIndex(l,d[0]),b:stIndex(l,d[1]),ti:Math.max(0,typesOf(l).findIndex(t=>t.k===d[2]))};}
function openTrip(l){
  const same=l===line,df=defTrip(l);draft={line:l,a:same?trip.a:df.a,b:same?trip.b:df.b,start:trip.start,ti:same?trip.ti:df.ti,ser:same?trip.ser:null};
  side='from';openPanel('tripPanel');$('stList').scrollTop=0;drawTrip();
}
function setStart(m){draft.start=m;drawTrip();}
document.querySelectorAll('.tstep').forEach(b=>{let rep=null,first=null;
  const stop=()=>{clearTimeout(first);clearInterval(rep);first=rep=null;};
  b.addEventListener('pointerdown',e=>{if(b.disabled)return;e.preventDefault();const d=+b.dataset.d;setStart(draft.start+d);
    first=setTimeout(()=>{rep=setInterval(()=>{if(b.disabled){stop();return;}setStart(draft.start+d);},140);},450);});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setStart(draft.start+(+b.dataset.d));}});});
document.querySelectorAll('.ttquick button').forEach(b=>b.addEventListener('click',()=>{const q=b.dataset.q;
  if(q==='first')setStart(0);else if(q==='last')setStart(9999);else{const n=new Date();setStart(Math.round((n.getHours()*60+n.getMinutes())/5)*5);}}));
$('tripBack').addEventListener('click',()=>openPanel('picker','.lineBtn[aria-pressed="true"]'));
$('tripGo').addEventListener('click',()=>{const t=draftTrip();if(!t.ok)return;ensureAudio();setTrip(t,true);lastClock='';closePanel('tripPanel');save();goBtn.focus();});
function renderTT(){
  $('ttSum').textContent=trip.type.k+'　'+fmt(depMin(0))+' '+st(0)[0]+'はつ → '+fmt(arrMin(tripLen()))+' '+st(tripLen())[0]+'ゆき'+(delay>0?'（いま やく'+delay+'ふん おくれ）':'');
  const cur=atStation()?kNear(pos):target-1;
  const L=Math.floor(cur/legLen()),k0=L*legLen(),hi=atStation()?cur:target;
  const tb=$('ttBody');tb.textContent='';
  for(let j=0;j<=legLen();j++){const k=k0+j,n=st(k),tr=document.createElement('tr');if(k===hi)tr.className='now';
    const a=document.createElement('td'),b=document.createElement('td'),c=document.createElement('td');
    a.textContent=n[0];const sm=document.createElement('small');sm.textContent=n[1];a.appendChild(sm);
    b.className='t';c.className='t';if(!isStop(k)){b.textContent='レ';c.textContent='レ';tr.className=(tr.className+' pass').trim();}else{
      const dA=(k in delayLog)?delayLog[k]:delay,dD=(k in depLog)?depLog[k]:delay;
      const put=(cell,t,dl)=>{cell.textContent=fmt(t);if(dl>0){const sm=document.createElement('small');sm.className='late';sm.textContent=dl+'ふん おくれ';cell.appendChild(sm);}};
      if(j>0)put(b,arrMin(k),dA);if(j<legLen())put(c,depMin(k),dD);}
    tr.append(a,b,c);tb.appendChild(tr);}
}
$('ttBtn').addEventListener('click',()=>{renderTT();openPanel('tt');});
$('pick').addEventListener('click',()=>{ensureAudio();openPanel('picker','.lineBtn[aria-pressed="true"]');});

/* ---------- そうさ ---------- */
function bindHold(el,prefix){
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}press(prefix+e.pointerId);});
  const up=e=>release(prefix+e.pointerId);
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
bindHold(goBtn,'g');bindHold(cv,'c');
hornBtn.addEventListener('click',horn);
/* ---------- よく ある しゃない アナウンス ---------- */
function nextInfo(){const k=moving()?target:nextStop(kNear(pos));return {n:st(k),t:arrMin(k)+delay};}
function hereK(){return moving()?target-1:kNear(pos);}
/* これから とまる えき（しゅうてんまで） */
function stopsAhead(){const k=hereK(),L=Math.floor(k/legLen()),end=(L+1)*legLen(),out=[];for(let j=k+1;j<=end;j++)if(isStop(j))out.push(st(j));return out;}
const ANN=[
 {t:'つぎの えき',d:'つぎに とまる えきと じこく',f:()=>{const x=nextInfo();return ['つぎは、'+x.n[1]+'です。'+x.n[1]+'には、'+fmtJa(x.t)+'に つきます。','The next station is '+enSt(x.n)+'.','つぎは '+x.n[0]+' '+fmt(x.t)+'着  Next '+enSt(x.n)];}},
 {t:'ゆきさき',d:'しゅべつと いきさき',f:()=>{const k=hereK(),d=dest(k),ty=tyAt(k),af=allInfo(k);return ['この でんしゃは、'+typeJa(ty)+'、'+d[1]+'ゆき です。'+(af?af[1]+'から さきは、かくえきに とまります。':''),'This is '+typeEn(ty,k)+' bound for '+d[2]+'.','この でんしゃは '+ty.k+' '+d[0]+'ゆき です'+(af?'  '+af[0]+'から さきは 各駅に とまります':'')];}},
 {t:'とまる えき',d:'この さき とまる えきを ぜんぶ',f:()=>{const s=stopsAhead(),k=hereK(),ty=tyAt(k);if(!s.length)return['この でんしゃは、ここが しゅうてん です。',null,'この でんしゃは ここが しゅうてん です'];
   return ['この でんしゃの とまる えきは、'+s.map(x=>x[1]).join('、')+'です。',null,ty.k+'の とまる えき  '+s.map(x=>x[0]).join(' ・ ')];}},
 {t:'ゆうせんせき',d:'せきを ゆずって ね',f:()=>['ゆうせんせきを ひつようと されている おきゃくさまが いらっしゃいましたら、おせきを おゆずり ください。','Please offer your seat to those who need it.','ゆうせんせきを ひつようと されている かたに おせきを おゆずり ください']},
 {t:'けいたいでんわ',d:'マナーモードに して ね',f:()=>['しゃないでは、けいたいでんわを マナーモードに せっていの うえ、つうわは ごえんりょ ください。','Please set your mobile phone to silent mode and refrain from talking on the phone.','けいたいでんわは マナーモードに  つうわは ごえんりょ ください']},
 {t:'かけこみ じょうしゃ',d:'あぶないから やめてね',f:()=>['かけこみ じょうしゃは、たいへん きけん ですので おやめ ください。','Please do not rush onto the train.','かけこみ じょうしゃは きけん です  おやめ ください']},
 {t:'じこくどおり',d:'よていどおりか おくれて いるか',f:()=>delay>0?['この でんしゃは、ただいま、やく'+delay+'ふん おくれて おります。ごめいわくを おかけして もうしわけ ございません。','This train is running about '+delay+' minutes behind schedule.','ただいま やく '+delay+'ふん おくれて います']:['この でんしゃは、ただいま、ていじに はしって おります。','This train is running on schedule.','ただいま ていじに はしって います']},
 {t:'おわすれもの',d:'おりる まえの ちゅうい',f:()=>['おおりの さいは、おわすれものの ないよう、ごちゅうい ください。','Please make sure you have all your belongings with you when you leave the train.','おわすれものの ないよう ごちゅうい ください']},
 {t:'ありがとう',d:'ごりようの おれい',f:()=>['きょうも せいぶせんを ごりよう いただきまして、ありがとう ございます。','Thank you for riding the Seibu Line.','きょうも 西武線を ごりよう いただきまして ありがとうございます']}
];
const annGrid=$('annGrid');
ANN.forEach(a=>{const b=document.createElement('button');b.type='button';b.className='ann';
  const t=document.createElement('span');t.textContent=a.t;const d=document.createElement('small');d.textContent=a.d;b.append(t,d);
  b.addEventListener('click',()=>{ensureAudio();const [ja,en,ledText]=a.f();carChime();announce(ja,en,800,true);led(ledText);
    annGrid.querySelectorAll('.ann').forEach(x=>x.classList.remove('playing'));b.classList.add('playing');});
  annGrid.appendChild(b);});
$('annBtn').addEventListener('click',()=>{ensureAudio();openPanel('annPanel','.ann');});
const CREW=[
 {t:'しゅっぱつ しんこう！',d:'でんしゃが うごきだす とき',say:'しゅっぱつ、しんこう！'},
 {t:'ドア しまります！',d:'ドアを しめる まえ',say:'ドアが しまります！ ごちゅうい ください！'},
 {t:'ホーム よし！',d:'ホームの あんぜんを たしかめる',say:'ホーム、よし！'},
 {t:'ピーッ（ふえ）',d:'しゃしょうさんの ふえ',whistle:true},
 {t:'しんごう よし！',d:'しんごうを たしかめる',say:'しんごう、よし！'},
 {t:'つうか よし！',d:'とおりすぎる えきを たしかめる',say:'つうか、よし！'},
 {t:'ていしゃ よし！',d:'ちゃんと とまったか たしかめる',say:'ていしゃいち、よし！'},
 {t:'おつかれさまでした',d:'しゅうてんに ついた とき',say:'おつかれさまでした！'}
];
const crewGrid=$('crewGrid');
CREW.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='ann crew';
  const t=document.createElement('span');t.textContent=c.t;const d=document.createElement('small');d.textContent=c.d;b.append(t,d);
  b.addEventListener('click',()=>{ensureAudio();if(c.whistle){whistle();crewText='ピーッ！';}else{crewSay(c.say);crewText=c.t;}crewT=2.2;
    crewGrid.querySelectorAll('.ann').forEach(x=>x.classList.remove('playing'));b.classList.add('playing');});
  crewGrid.appendChild(b);});
$('crewBtn').addEventListener('click',()=>{ensureAudio();openPanel('crewPanel','.ann');});
const eGrid=$('eGrid');
EREASONS.forEach(r=>{const b=document.createElement('button');b.type='button';b.className='ann em';
  const t=document.createElement('span');t.textContent=r.t;const d=document.createElement('small');d.textContent=r.d;
  const ic=document.createElementNS('http://www.w3.org/2000/svg','svg');ic.setAttribute('aria-hidden','true');ic.setAttribute('class','eic');
  const u=document.createElementNS('http://www.w3.org/2000/svg','use');u.setAttribute('href','#e-'+r.ic);ic.appendChild(u);
  const tx=document.createElement('span');tx.className='etx';tx.append(t,d);b.append(ic,tx);
  b.addEventListener('click',()=>{ensureAudio();closePanel('ePanel');emergency(r);});eGrid.appendChild(b);});
$('eBtn').addEventListener('click',()=>{ensureAudio();if(!canEmergency())return;openPanel('ePanel','.ann');});
autoBtn.addEventListener('click',()=>{ensureAudio();auto=!auto;autoBtn.setAttribute('aria-pressed',auto);if(auto&&state==='stopped')stopT=Math.max(stopT,5);save();});
sndBtn.addEventListener('click',()=>{ensureAudio();soundOn=!soundOn;applySound();save();});
/* ---------- ぜんがめん ---------- */
const fsBtn=$('fsBtn'),root=document.documentElement;
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsOK=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled)&&!!(root.requestFullscreen||root.webkitRequestFullscreen);
if(fsOK)fsBtn.hidden=false;
/* iPad の Safari は ぜんがめんの とき 左上に かいじょボタンを かさねて だすので、そのあいだだけ よける */
const isIPad=/iPad/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
function fsSync(){const on=!!fsEl();document.documentElement.classList.toggle('fs-ipad',on&&isIPad);fsBtn.querySelector('use').setAttribute('href',on?'#i-exit':'#i-full');fsBtn.querySelector('span').textContent=on?'もどす':'ぜんがめん';fsBtn.setAttribute('aria-label',on?'ぜんがめん おわり':'ぜんがめん');fsBtn.setAttribute('aria-pressed',on);setTimeout(resize,150);}
fsBtn.addEventListener('click',()=>{ensureAudio();try{
  if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
  else{const r=(root.requestFullscreen||root.webkitRequestFullscreen).call(root);if(r&&r.catch)r.catch(()=>{fsBtn.hidden=true;});}
}catch(e){fsBtn.hidden=true;}});
document.addEventListener('fullscreenchange',fsSync);document.addEventListener('webkitfullscreenchange',fsSync);
/* ---------- しゃりょう えらび（いまの しゅべつで はしる しゃりょうだけ） ---------- */
const pv=$('pv'),pvctx=pv.getContext('2d');
function withCtx(c,fn){const main=ctx,mty=ty,md=doorAnim,mp=pos;ctx=c;doorAnim=0;ty=74;try{fn();}finally{ctx=main;ty=mty;doorAnim=md;pos=mp;}}
function drawPreview(){
  withCtx(pvctx,()=>{const S=SER();
    pvctx.setTransform(2,0,0,2,0,0);pvctx.fillStyle='#bfe6ff';pvctx.fillRect(0,0,420,90);
    pvctx.fillStyle='#9c9488';pvctx.fillRect(0,ty+2,420,14);pvctx.fillStyle='#7b8494';pvctx.fillRect(0,ty-1,420,3);
    pvctx.strokeStyle='#4b5563';pvctx.lineWidth=1;pvctx.beginPath();pvctx.moveTo(0,ty-99);pvctx.lineTo(420,ty-99);pvctx.stroke();
    const t0=trip.type;drawConsist(S,404,ty-60,ty-10,false,[t0.k,t0.c,trip.dest(0)[0]],-300);});
}
function renderSeries(){
  const ids=trip.type.ser||[],S=SER(),list=$('serList');list.textContent='';
  $('serInfo').textContent='';const b0=document.createElement('b');b0.textContent=S.name;const p=document.createElement('div');p.textContent=S.desc||'';$('serInfo').append(b0,p);
  ids.forEach(id=>{const X0=serOf(id),b=document.createElement('button');b.type='button';
    const i=document.createElement('i');i.style.setProperty('--sc',X0.ui[0]);i.style.setProperty('--sc2',X0.ui[1]);
    const sm=document.createElement('small');sm.textContent=(trip.type.cars||X0.cars)+'りょう・ドア '+X0.doors+'つ';
    b.append(i,document.createTextNode(X0.name),sm);b.setAttribute('aria-pressed',id===trip.ser);
    b.addEventListener('click',()=>{trip.ser=id;curS=null;computeDoors();applyColor();renderSeries();lastLabel='';save();});list.appendChild(b);});
}
$('paintBtn').addEventListener('click',()=>{openPanel('painter');renderSeries();applyColor();});
function applySound(){sndBtn.setAttribute('aria-pressed',soundOn);sndBtn.querySelector('use').setAttribute('href',soundOn?'#i-sound':'#i-mute');sndBtn.querySelector('span').textContent=soundOn?'おと あり':'おと なし';sndBtn.setAttribute('aria-label',soundOn?'おと あり':'おと なし');
  if(master)master.gain.setTargetAtTime(soundOn?0.8:0,AC.currentTime,0.05);if(!soundOn)stopSpeech();}
function applyColor(){const rt=$('route'),S=SER();rt.style.setProperty('--up',S.ui[1]);rt.style.setProperty('--low',S.ui[0]);rt.style.setProperty('--line',S.ui[1]);drawPreview();if(!titleEl.hidden)drawTitleTrain();}
/* ---------- タイトル がめん ---------- */
const titleEl=$('title'),tctx=$('tcv').getContext('2d'),TLW=1700;
const calm=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
let tWheel=0,tLast=0;
function drawTitleTrain(){
  withCtx(tctx,()=>{pos=tWheel;tctx.setTransform(2,0,0,2,0,0);tctx.clearRect(0,0,TLW,90);
    const t0=trip.type;drawConsist(SER(),TLW-202,ty-60,ty-10,false,[t0.k,t0.c,trip.dest(0)[0]],-200);});
}
function titleFrame(now){
  if(titleEl.hidden){tLast=0;return;}
  if(tLast)tWheel+=Math.min(0.05,(now-tLast)/1000)*120;
  tLast=now;drawTitleTrain();requestAnimationFrame(titleFrame);
}
function showTitle(){openPanel('title','#tStart');tLast=0;drawTitleTrain();if(!calm.matches)requestAnimationFrame(titleFrame);}
$('tStart').addEventListener('click',()=>{ensureAudio();carChime();closePanel('title');goBtn.focus({preventScroll:true});});
$('tPick').addEventListener('click',()=>{ensureAudio();openPanel('picker','.lineBtn[aria-pressed="true"]');});
$('homeBtn').addEventListener('click',showTitle);
window.addEventListener('keydown',e=>{
  if(anyPanel()){if(e.key==='Escape')PANELS.forEach(closePanel);return;}
  const b=e.target.closest&&e.target.closest('button');
  if(b&&b!==goBtn)return;
  if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();if(!e.repeat)press('k');}
  else if(e.key==='h'||e.key==='H'){horn();}
});
window.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight')release('k');});
document.addEventListener('visibilitychange',()=>{if(document.hidden)holders.clear();});
window.addEventListener('resize',resize);

function start(data){
  const d=restoreSayamaSelection(Object.assign({},load(),data||{}));
  auto=!!d.auto;let startMin;{const hs=data&&data.startMin;if(Number.isInteger(hs)&&hs>=300&&hs<=1440)startMin=hs;else{const now=new Date();startMin=Math.round((now.getHours()*60+now.getMinutes())/5)*5;}}if(typeof d.mapOn==='boolean')mapOn=d.mapOn;applyMap();if(typeof d.soundOn==='boolean')soundOn=d.soundOn;
  const R=ROUTES.find(l=>l.id===d.lineId)||ROUTES[0],df=defTrip(R);let t=new Trip(R,d.lineId?d.tripA:df.a,d.lineId?d.tripB:df.b,startMin,d.lineId?d.ti:df.ti,d.ser);if(!t.ok)t=new Trip(R,df.a,df.b,startMin,df.ti,null);
  setTrip(t,false);
  autoBtn.setAttribute('aria-pressed',auto);applySound();applyColor();
  const hot=window.claude&&window.claude.hot;
  if(hot&&hot.snapshot){try{hot.snapshot(()=>({auto,soundOn,mapOn,startMin:trip.start,tripA:trip.a,tripB:trip.b,ti:trip.ti,ser:trip.ser,lineId:line.id}));}catch(e){}}
  resize();
  if(document.fonts&&document.fonts.load){document.fonts.load('800 28px "M PLUS Rounded 1c"').catch(()=>{});}
  requestAnimationFrame(frame);
  showTitle();
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data?hot.data:{});
})();
